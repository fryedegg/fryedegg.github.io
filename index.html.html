<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Oratoria // The Shattering — Interactive Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Chakra+Petch:wght@500;600;700&family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-deep: #03050a;
  --bg: #07090f;
  --bg-card: #0e1119;
  --bg-card-2: #0a0d14;
  --bg-inset: #050709;
  --line: #1a2030;
  --line-bright: #2a3548;

  --text: #e8eef5;
  --text-dim: #a8b8c8;
  --muted: #6b7c8e;
  --faint: #455666;

  --inner: #ffc16e;     /* gold - inner rim / fey courts */
  --inner-glow: rgba(255, 193, 110, 0.5);
  --mid: #4dd4ff;       /* cyan - midreach */
  --mid-glow: rgba(77, 212, 255, 0.5);
  --outer: #b073ff;     /* purple - outer rim */
  --outer-glow: rgba(176, 115, 255, 0.5);
  --station: #ff5fa2;   /* magenta - stations */
  --station-glow: rgba(255, 95, 162, 0.5);
  --void: #6a3a52;      /* dark crimson - the maw */
  --void-glow: rgba(180, 40, 80, 0.4);
  --unknown: #d4a373;   /* tan - gray haven, unknown */

  --shadow: 0 12px 40px rgba(0,0,0,0.7);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }

body {
  font-family: 'Geist', system-ui, sans-serif;
  color: var(--text);
  background: var(--bg-deep);
  -webkit-font-smoothing: antialiased;
}

/* Subtle grain */
body::after {
  content: '';
  position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 0.3 0 0 0 0 0.5 0 0 0 0 0.9 0 0 0 0.04 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  opacity: 0.5;
  pointer-events: none;
  z-index: 1;
  mix-blend-mode: overlay;
}

/* ===========================================================
   TOP BAR
   =========================================================== */
.topbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 50;
  padding: 12px 18px;
  background: linear-gradient(180deg, rgba(3,5,10,0.96), rgba(3,5,10,0.85) 70%, transparent);
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 18px;
  align-items: center;
  pointer-events: none;
}
.topbar > * { pointer-events: auto; }

.brand {
  display: flex; align-items: center; gap: 12px;
}
.brand-mark {
  width: 38px; height: 38px;
  filter: drop-shadow(0 0 10px var(--mid-glow));
}
.brand-text {
  font-family: 'Cinzel', serif;
  font-weight: 700;
  font-size: 18px;
  letter-spacing: 0.16em;
  color: var(--text);
  text-transform: uppercase;
  background: linear-gradient(180deg, #ffd6a0, #f3ece3 60%, #c9aa78);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  line-height: 1;
}
.brand-sub {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 0.2em;
  margin-top: 3px;
  text-transform: uppercase;
}

.search-wrap {
  display: flex; justify-content: center;
  position: relative;
}
.search {
  width: 100%;
  max-width: 320px;
  padding: 9px 14px 9px 36px;
  background: rgba(14,17,25, 0.85);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--text);
  font-family: 'Geist', sans-serif;
  font-size: 13px;
  outline: none;
  transition: all 0.15s ease;
}
.search:focus {
  border-color: var(--mid);
  box-shadow: 0 0 0 3px rgba(77, 212, 255, 0.15), 0 6px 20px rgba(0,0,0,0.5);
}
.search-icon {
  position: absolute;
  left: calc(50% - 160px + 12px);
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  pointer-events: none;
  width: 16px; height: 16px;
}
.search-results {
  position: absolute;
  top: calc(100% + 6px);
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 320px;
  background: rgba(14,17,25, 0.96);
  backdrop-filter: blur(20px);
  border: 1px solid var(--line);
  border-radius: 12px;
  max-height: 340px;
  overflow-y: auto;
  display: none;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  z-index: 100;
}
.search-results.open { display: block; }
.search-result {
  padding: 9px 14px;
  cursor: pointer;
  font-size: 13px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  display: flex; justify-content: space-between; align-items: center;
}
.search-result:hover { background: rgba(77, 212, 255, 0.08); }
.search-result-type {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9.5px;
  color: var(--muted);
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.controls {
  display: flex; gap: 6px; align-items: center;
  background: rgba(14,17,25, 0.85);
  backdrop-filter: blur(14px);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px;
}
.control-btn {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: transparent;
  border: none;
  color: var(--text-dim);
  cursor: pointer;
  font-size: 14px;
  display: inline-flex; align-items: center; justify-content: center;
  transition: all 0.12s ease;
}
.control-btn:hover {
  background: rgba(77, 212, 255, 0.12);
  color: var(--mid-bright, #7ae5ff);
}
.zoom-display {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  padding: 0 8px;
  min-width: 48px;
  text-align: center;
}
.dm-toggle {
  display: flex; align-items: center; gap: 6px;
  margin-left: 8px;
  padding: 4px 12px 4px 4px;
  background: rgba(14,17,25, 0.85);
  backdrop-filter: blur(14px);
  border: 1px solid var(--line);
  border-radius: 999px;
  cursor: pointer;
  user-select: none;
  font-size: 11px;
  font-family: 'Chakra Petch', sans-serif;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  transition: all 0.12s ease;
}
.dm-toggle.on {
  border-color: rgba(255, 95, 162, 0.4);
  color: var(--station);
  box-shadow: 0 0 12px rgba(255, 95, 162, 0.15);
}
.dm-pip {
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--bg-inset);
  border: 1px solid var(--line);
  display: inline-flex; align-items: center; justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 700;
}
.dm-toggle.on .dm-pip {
  background: var(--station);
  color: #1a0a13;
  border-color: var(--station);
}

/* ===========================================================
   MAP
   =========================================================== */
.map-stage {
  position: fixed;
  inset: 0;
  cursor: grab;
  overflow: hidden;
  background: radial-gradient(ellipse at 50% 50%, #0a0e18 0%, #03050a 70%);
}
.map-stage.dragging { cursor: grabbing; }
.map-stage svg {
  display: block;
  width: 100%; height: 100%;
  user-select: none;
}

/* Star background layer */
.starfield {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
}
.star {
  position: absolute;
  width: 1.5px; height: 1.5px;
  background: #fff;
  border-radius: 50%;
  opacity: 0.5;
  animation: twinkle var(--dur, 4s) ease-in-out infinite;
  animation-delay: var(--delay, 0s);
}
@keyframes twinkle {
  0%, 100% { opacity: 0.2; transform: scale(0.8); }
  50% { opacity: 0.9; transform: scale(1.2); }
}

/* SVG planet styling */
.rim-ring {
  fill: none;
  stroke-width: 1.5;
  cursor: pointer;
  transition: all 0.2s ease;
}
.rim-ring.inner { stroke: var(--inner); filter: drop-shadow(0 0 6px var(--inner-glow)); }
.rim-ring.mid { stroke: var(--mid); filter: drop-shadow(0 0 6px var(--mid-glow)); }
.rim-ring.outer { stroke: var(--outer); filter: drop-shadow(0 0 8px var(--outer-glow)); }
.rim-ring:hover {
  stroke-width: 3;
}

.rim-band {
  cursor: pointer;
  fill: transparent;
  transition: fill 0.2s ease;
}
.rim-band:hover { fill: rgba(255, 255, 255, 0.015); }

.rim-label {
  font-family: 'Cinzel', serif;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.3em;
  pointer-events: none;
  opacity: 0.4;
}
.rim-label.inner { fill: var(--inner); }
.rim-label.mid { fill: var(--mid); }
.rim-label.outer { fill: var(--outer); }

.galaxy-spiral {
  fill: none;
  stroke: rgba(255, 255, 255, 0.05);
  stroke-width: 1;
  pointer-events: none;
}

.fey-core {
  cursor: pointer;
}
.fey-core-body {
  fill: #fff5d6;
  filter: drop-shadow(0 0 18px #ffeaa0) drop-shadow(0 0 35px #ffb84a);
  animation: core-pulse 3s ease-in-out infinite;
}
@keyframes core-pulse {
  0%, 100% { filter: drop-shadow(0 0 18px #ffeaa0) drop-shadow(0 0 35px #ffb84a); }
  50% { filter: drop-shadow(0 0 26px #ffeaa0) drop-shadow(0 0 50px #ffb84a); }
}

.planet {
  cursor: pointer;
}
.planet-hit {
  fill: transparent;
  /* big invisible click target */
}
.planet-dot {
  transition: all 0.15s ease;
  pointer-events: none;
}
.planet:hover .planet-dot {
  transform-box: fill-box;
  transform-origin: center;
  transform: scale(1.4);
}
.planet.inner .planet-dot { fill: var(--inner); filter: drop-shadow(0 0 5px var(--inner-glow)); }
.planet.mid .planet-dot { fill: var(--mid); filter: drop-shadow(0 0 5px var(--mid-glow)); }
.planet.outer .planet-dot { fill: var(--outer); filter: drop-shadow(0 0 6px var(--outer-glow)); }
.planet.station .planet-dot {
  fill: var(--station);
  filter: drop-shadow(0 0 8px var(--station-glow));
}
.planet.unknown .planet-dot {
  fill: var(--unknown);
  filter: drop-shadow(0 0 5px rgba(212, 163, 115, 0.5));
}
.planet.visited .planet-ring {
  fill: none;
  stroke: var(--station);
  stroke-width: 1.2;
  stroke-dasharray: 2 3;
  filter: drop-shadow(0 0 4px var(--station-glow));
  animation: visited-spin 14s linear infinite;
  transform-box: fill-box;
  transform-origin: center;
}
@keyframes visited-spin {
  to { transform: rotate(360deg); }
}
.planet.selected .planet-dot {
  filter: drop-shadow(0 0 14px var(--mid-glow)) drop-shadow(0 0 24px var(--mid-glow));
}
.planet.selected .selection-ring {
  fill: none;
  stroke: #fff;
  stroke-width: 1.5;
  opacity: 0.9;
  animation: select-pulse 2s ease-in-out infinite;
  transform-box: fill-box;
  transform-origin: center;
}
@keyframes select-pulse {
  0%, 100% { opacity: 0.6; r: 14; }
  50% { opacity: 1; r: 18; }
}

.planet-label {
  font-family: 'Geist', sans-serif;
  font-size: 11px;
  font-weight: 500;
  fill: var(--text-dim);
  pointer-events: none;
  paint-order: stroke;
  stroke: rgba(3, 5, 10, 0.85);
  stroke-width: 3;
  stroke-linejoin: round;
}
.planet:hover .planet-label { fill: #fff; }
.planet.station .planet-label { fill: #ffb8d8; }
.planet.visited .planet-label::after { content: ' ✓'; }

.label-line {
  stroke: var(--line-bright);
  stroke-width: 0.5;
  pointer-events: none;
  opacity: 0.6;
}

/* The Maw / void */
.void-anomaly { cursor: pointer; }
.void-anomaly-bg {
  fill: #000;
  filter: drop-shadow(0 0 30px rgba(255, 60, 40, 0.3));
}
.void-anomaly-ring {
  fill: none;
  stroke: var(--void);
  stroke-width: 1.5;
  stroke-dasharray: 4 6;
  animation: void-spin 30s linear infinite;
  transform-origin: center;
}
@keyframes void-spin {
  to { transform: rotate(360deg); }
}
.void-anomaly-ring.r2 {
  stroke-dasharray: 2 8;
  animation: void-spin 45s linear infinite reverse;
}
.void-label {
  font-family: 'Cinzel', serif;
  font-weight: 600;
  fill: var(--unknown);
  text-anchor: middle;
  pointer-events: none;
  letter-spacing: 0.15em;
  text-transform: uppercase;
}

/* Gray Haven floating ? */
.unknown-marker { cursor: pointer; }
.unknown-marker-q {
  font-family: 'Cinzel', serif;
  font-weight: 800;
  font-size: 28px;
  fill: var(--unknown);
  text-anchor: middle;
  dominant-baseline: middle;
  filter: drop-shadow(0 0 8px rgba(212, 163, 115, 0.4));
}
.unknown-marker-frame {
  fill: rgba(212, 163, 115, 0.05);
  stroke: var(--unknown);
  stroke-width: 1;
  stroke-dasharray: 3 4;
}

/* ===========================================================
   TOOLTIP
   =========================================================== */
.tooltip {
  position: fixed;
  pointer-events: none;
  background: rgba(10, 13, 20, 0.96);
  backdrop-filter: blur(12px);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 7px 12px;
  font-size: 12px;
  color: var(--text);
  z-index: 200;
  opacity: 0;
  transition: opacity 0.12s ease;
  box-shadow: 0 8px 24px rgba(0,0,0,0.6);
  white-space: nowrap;
}
.tooltip.show { opacity: 1; }
.tooltip-name {
  font-family: 'Chakra Petch', sans-serif;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.04em;
}
.tooltip-type {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9.5px;
  color: var(--muted);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-top: 2px;
}

/* ===========================================================
   INFO PANEL
   =========================================================== */
.info-panel {
  position: fixed;
  top: 0; right: 0;
  height: 100vh;
  width: 420px;
  max-width: 92vw;
  background: linear-gradient(180deg, rgba(14,17,25, 0.97), rgba(7,9,15, 0.97));
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-left: 1px solid var(--line);
  box-shadow: -20px 0 60px rgba(0,0,0,0.6);
  transform: translateX(100%);
  transition: transform 0.35s cubic-bezier(0.32, 0.72, 0.24, 1);
  z-index: 90;
  display: flex; flex-direction: column;
  overflow: hidden;
}
.info-panel.open { transform: translateX(0); }

.info-head {
  padding: 22px 22px 14px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(77, 212, 255, 0.04), transparent);
  position: relative;
}
.info-head.inner { background: linear-gradient(180deg, rgba(255, 193, 110, 0.06), transparent); }
.info-head.mid { background: linear-gradient(180deg, rgba(77, 212, 255, 0.06), transparent); }
.info-head.outer { background: linear-gradient(180deg, rgba(176, 115, 255, 0.06), transparent); }
.info-head.station { background: linear-gradient(180deg, rgba(255, 95, 162, 0.06), transparent); }
.info-head.void { background: linear-gradient(180deg, rgba(180, 40, 80, 0.08), transparent); }
.info-head.unknown { background: linear-gradient(180deg, rgba(212, 163, 115, 0.06), transparent); }

.info-close {
  position: absolute;
  top: 16px; right: 18px;
  width: 30px; height: 30px;
  border-radius: 50%;
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--line);
  color: var(--text-dim);
  cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 16px;
  transition: all 0.12s;
}
.info-close:hover { background: rgba(255, 95, 95, 0.15); color: #fff; border-color: rgba(255, 95, 95, 0.3); }

.info-eyebrow {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 6px;
  display: flex; align-items: center; gap: 8px;
}
.info-eyebrow .dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  display: inline-block;
}
.info-eyebrow.inner .dot { background: var(--inner); box-shadow: 0 0 6px var(--inner-glow); }
.info-eyebrow.mid .dot { background: var(--mid); box-shadow: 0 0 6px var(--mid-glow); }
.info-eyebrow.outer .dot { background: var(--outer); box-shadow: 0 0 6px var(--outer-glow); }
.info-eyebrow.station .dot { background: var(--station); box-shadow: 0 0 6px var(--station-glow); }
.info-eyebrow.void .dot { background: var(--void); box-shadow: 0 0 6px var(--void-glow); }
.info-eyebrow.unknown .dot { background: var(--unknown); box-shadow: 0 0 6px rgba(212, 163, 115, 0.5); }

.info-title {
  font-family: 'Cinzel', serif;
  font-size: 30px;
  font-weight: 700;
  margin: 0 0 4px;
  line-height: 1.05;
  letter-spacing: 0.02em;
  background: linear-gradient(180deg, #fff, #c9b8a3);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}
.info-subtitle {
  color: var(--muted);
  font-size: 12.5px;
  font-style: italic;
  margin-bottom: 4px;
}
.visited-tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin-top: 8px;
  padding: 3px 10px 3px 8px;
  border-radius: 999px;
  background: rgba(255, 95, 162, 0.12);
  border: 1px solid rgba(255, 95, 162, 0.35);
  color: var(--station);
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 600;
}

.info-body {
  flex: 1;
  overflow-y: auto;
  padding: 18px 22px 30px;
  scroll-behavior: smooth;
}
.info-body::-webkit-scrollbar { width: 8px; }
.info-body::-webkit-scrollbar-track { background: transparent; }
.info-body::-webkit-scrollbar-thumb { background: var(--line-bright); border-radius: 4px; }

.info-section {
  margin-bottom: 18px;
}
.info-section-label {
  font-family: 'Chakra Petch', sans-serif;
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 8px;
  display: flex; align-items: center; gap: 8px;
}
.info-section-label::before {
  content: '';
  width: 18px; height: 1px;
  background: currentColor;
  opacity: 0.6;
}
.info-section.dm .info-section-label {
  color: var(--station);
}
.info-text {
  font-size: 14px;
  line-height: 1.65;
  color: var(--text-dim);
}
.info-text strong { color: var(--text); font-weight: 600; }
.info-text em { color: var(--inner); font-style: italic; }

.info-section.dm {
  background: rgba(255, 95, 162, 0.04);
  border: 1px solid rgba(255, 95, 162, 0.2);
  border-radius: 10px;
  padding: 14px 16px;
}
.info-section.dm .info-text {
  font-size: 13px;
  color: var(--text-dim);
}

.info-quick {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 18px;
}
.info-quick-tile {
  background: var(--bg-inset);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 9px 11px;
}
.info-quick-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  color: var(--muted);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  margin-bottom: 3px;
}
.info-quick-val {
  font-family: 'Chakra Petch', sans-serif;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
}

/* DEITY / COURT CARD (Inner Rim) */
.deity-card {
  background: linear-gradient(180deg, rgba(255, 193, 110, 0.08), rgba(255, 193, 110, 0.02));
  border: 1px solid rgba(255, 193, 110, 0.25);
  border-radius: 10px;
  padding: 14px 16px;
  margin-bottom: 18px;
  display: grid;
  grid-template-columns: 36px 1fr;
  gap: 12px;
  align-items: center;
}
.deity-sigil {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #fff5d6, #ffc16e 50%, transparent 80%);
  filter: drop-shadow(0 0 8px rgba(255, 193, 110, 0.6));
  display: flex; align-items: center; justify-content: center;
  color: #2a1f10;
  font-family: 'Cinzel', serif;
  font-weight: 800;
  font-size: 16px;
}
.deity-name {
  font-family: 'Cinzel', serif;
  font-size: 15px;
  font-weight: 700;
  color: var(--inner);
  line-height: 1.15;
  margin-bottom: 3px;
}
.deity-court {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  color: var(--ash, #efb86b);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-top: 4px;
}
.deity-domain {
  font-size: 12px;
  color: var(--muted);
  font-style: italic;
}

/* CONTACTS LIST */
.contact-list {
  display: flex; flex-direction: column;
  gap: 8px;
}
.contact-card {
  background: var(--bg-inset);
  border: 1px solid var(--line);
  border-left: 3px solid var(--mid);
  border-radius: 8px;
  padding: 10px 12px;
}
.contact-card.allied { border-left-color: var(--green, #4ade80); }
.contact-card.friendly { border-left-color: var(--mid); }
.contact-card.captive { border-left-color: var(--station); }
.contact-card.hostile { border-left-color: var(--magenta, #ff4d8b); }
.contact-card.deceased { border-left-color: var(--muted); opacity: 0.75; }
.contact-card.untrustworthy { border-left-color: var(--amber, #ffb547); }
.contact-card.mercenary { border-left-color: var(--amber, #ffb547); }
.contact-card.job-giver { border-left-color: var(--inner); }
.contact-card.unknown { border-left-color: var(--unknown); }

.contact-row {
  display: flex; justify-content: space-between; align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
}
.contact-name {
  font-family: 'Chakra Petch', sans-serif;
  font-weight: 700;
  font-size: 14px;
  color: var(--text);
  letter-spacing: 0.02em;
}
.contact-card.deceased .contact-name { text-decoration: line-through; color: var(--muted); }
.contact-faction {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 2px 6px;
  border-radius: 4px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--line);
  white-space: nowrap;
}
.contact-card.allied .contact-faction { color: var(--green, #4ade80); border-color: rgba(74, 222, 128, 0.3); background: rgba(74, 222, 128, 0.06); }
.contact-card.friendly .contact-faction { color: var(--mid); border-color: rgba(77, 212, 255, 0.3); background: rgba(77, 212, 255, 0.06); }
.contact-card.hostile .contact-faction { color: var(--magenta-bright, #ff7aaf); border-color: rgba(255, 77, 139, 0.4); background: rgba(255, 77, 139, 0.08); }
.contact-card.captive .contact-faction { color: var(--station); border-color: rgba(255, 95, 162, 0.4); background: rgba(255, 95, 162, 0.08); }
.contact-card.untrustworthy .contact-faction,
.contact-card.mercenary .contact-faction { color: var(--amber-bright, #ffc870); border-color: rgba(255, 181, 71, 0.4); background: rgba(255, 181, 71, 0.06); }
.contact-card.job-giver .contact-faction { color: var(--inner); border-color: rgba(255, 193, 110, 0.4); background: rgba(255, 193, 110, 0.06); }
.contact-card.deceased .contact-faction { color: var(--muted); }

.contact-role {
  font-size: 11.5px;
  color: var(--text-dim);
  margin-top: 2px;
  font-style: italic;
}
.contact-desc {
  font-size: 12px;
  color: var(--text-dim);
  margin-top: 6px;
  line-height: 1.55;
}

/* INTEL LIST */
.intel-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex; flex-direction: column;
  gap: 6px;
}
.intel-item {
  position: relative;
  padding: 7px 10px 7px 22px;
  background: rgba(77, 212, 255, 0.04);
  border: 1px solid rgba(77, 212, 255, 0.12);
  border-radius: 7px;
  font-size: 12.5px;
  color: var(--text-dim);
  line-height: 1.5;
}
.intel-item::before {
  content: '▸';
  position: absolute;
  left: 8px; top: 7px;
  color: var(--mid);
  font-size: 11px;
}
.intel-item strong { color: var(--text); font-weight: 600; }

/* FACTION TAGS */
.faction-tags {
  display: flex; flex-wrap: wrap; gap: 5px;
}
.faction-tag {
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 10.5px;
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 0.06em;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--line);
  color: var(--text-dim);
}
.faction-tag.hostile {
  color: var(--magenta-bright, #ff7aaf);
  border-color: rgba(255, 77, 139, 0.4);
  background: rgba(255, 77, 139, 0.08);
}
.faction-tag.allied {
  color: var(--green, #4ade80);
  border-color: rgba(74, 222, 128, 0.3);
  background: rgba(74, 222, 128, 0.06);
}
.faction-tag.warning {
  color: var(--amber-bright, #ffc870);
  border-color: rgba(255, 181, 71, 0.4);
  background: rgba(255, 181, 71, 0.06);
}

/* DESTROYED planet visual */
.planet.destroyed .planet-dot {
  fill: var(--magenta, #ff4d8b) !important;
  filter: drop-shadow(0 0 6px rgba(255, 77, 139, 0.6)) !important;
}
.planet.destroyed .planet-label {
  fill: var(--magenta-bright, #ff7aaf);
  text-decoration: line-through;
  text-decoration-color: rgba(255, 77, 139, 0.7);
}
.destroyed-cross {
  stroke: var(--magenta-bright, #ff7aaf);
  stroke-width: 1.4;
  filter: drop-shadow(0 0 4px rgba(255, 77, 139, 0.6));
  pointer-events: none;
}

/* LEGEND */
.legend {
  position: fixed;
  bottom: 16px; left: 16px;
  background: rgba(10, 13, 20, 0.92);
  backdrop-filter: blur(14px);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px 14px;
  z-index: 30;
  font-size: 12px;
  display: flex; flex-direction: column; gap: 7px;
  box-shadow: var(--shadow);
}
.legend-row {
  display: flex; align-items: center; gap: 10px;
}
.legend-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
}
.legend-dot.inner { background: var(--inner); box-shadow: 0 0 6px var(--inner-glow); }
.legend-dot.mid { background: var(--mid); box-shadow: 0 0 6px var(--mid-glow); }
.legend-dot.outer { background: var(--outer); box-shadow: 0 0 6px var(--outer-glow); }
.legend-dot.station {
  background: var(--station); box-shadow: 0 0 6px var(--station-glow);
  transform: rotate(45deg); border-radius: 2px;
}
.legend-dot.unknown { background: var(--unknown); }
.legend-row .lbl {
  font-family: 'Geist', sans-serif;
  font-size: 11.5px;
  color: var(--text-dim);
}
.legend-row .sub {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9.5px;
  color: var(--muted);
  letter-spacing: 0.08em;
}

/* HELP HINT (dismissable) */
.help-hint {
  position: fixed;
  bottom: 16px; right: 16px;
  background: rgba(10, 13, 20, 0.92);
  backdrop-filter: blur(14px);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px 14px;
  z-index: 30;
  font-size: 11.5px;
  color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 0.06em;
  display: flex; align-items: center; gap: 14px;
  transition: opacity 0.4s ease;
}
.help-hint.fade { opacity: 0; pointer-events: none; }
.help-hint kbd {
  background: var(--bg-inset);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 1px 5px;
  font-size: 10.5px;
  color: var(--text);
}
.help-hint .close-x {
  cursor: pointer;
  color: var(--muted);
  padding-left: 4px;
  border-left: 1px solid var(--line);
  margin-left: 4px;
}

/* RESPONSIVE */
@media (max-width: 720px) {
  .topbar { grid-template-columns: 1fr; gap: 8px; padding: 10px; }
  .brand-text { font-size: 14px; }
  .brand-sub { display: none; }
  .search-wrap { order: 3; }
  .search-icon { left: 12px; }
  .controls { justify-content: center; order: 2; flex-wrap: wrap; }
  .info-panel { width: 100%; }
  .legend { display: none; }
  .help-hint { display: none; }
}
</style>
</head>

<!-- ============ STARFIELD ============ -->

  const state = {
    selectedId: null,

    tx: 0,
    ty: 0,

    dragStart: { x: 0, y: 0 },

  // Load from localStorage
  try {
    const saved = JSON.parse(localStorage.getItem('shattering-atlas-v1') || '{}');
    Object.assign(state, saved);
  } catch (e) {}
  // Always reset DM mode to OFF on load — never persist it across sessions.
  // Players who watch the password get entered once shouldn't stay unlocked forever.
  state.dmMode = false;

  function saveState() {
    try {
      localStorage.setItem('shattering-atlas-v1', JSON.stringify({
        // dmMode intentionally NOT saved — must be re-entered each session
        selectedId: state.selectedId,
      }));
    } catch (e) {}
  }

  // ============================================================
  // HELPERS
  // ============================================================
  const $ = id => document.getElementById(id);
  const qs = sel => document.querySelector(sel);
  const qsa = sel => Array.from(document.querySelectorAll(sel));
  const NS = 'http://www.w3.org/2000/svg';

  function findLoc(id) {
    if (id === 'maw') return VOID;
    if (id === 'fey-core') return { id: 'fey-core', name: 'Fey Court Core', rim: 'inner', subtitle: 'Heart of the Inner Rim', desc: 'The pulsing star at the center of the Inner Rim — the source-radiance from which the thirteen Fey Court worlds draw their divine charter. Old, vast, and watched.' };
    return LOCATIONS.find(l => l.id === id);
  }

  function getCoords(loc) {
    if (loc.x != null && loc.y != null) return { x: loc.x, y: loc.y };
    return pos(loc.angle, loc.radius);
  }

  function escapeHtml(s) {
    return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
  }

  // ============================================================
  // STARFIELD
  // ============================================================
  function buildStarfield() {
    const sf = $('starfield');
    const count = 140;
    const frag = document.createDocumentFragment();
    for (let i = 0; i < count; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      s.style.left = Math.random() * 100 + 'vw';
      s.style.top = Math.random() * 100 + 'vh';
      const size = 0.6 + Math.random() * 2.4;
      s.style.width = s.style.height = size + 'px';
      s.style.setProperty('--dur', (2.5 + Math.random() * 5) + 's');
      s.style.setProperty('--delay', (Math.random() * 5) + 's');
      if (Math.random() < 0.08) s.style.background = '#bce4ff';
      if (Math.random() < 0.04) s.style.background = '#ffd6a0';
      frag.appendChild(s);
    }
    sf.appendChild(frag);
  }

  // ============================================================
  // SPIRAL ARMS — decorative galaxy backdrop
  // ============================================================
  function buildSpirals() {
    const layer = $('spirals');
    const arms = 4;
    let html = '';
    for (let a = 0; a < arms; a++) {
      const baseAngle = (a / arms) * 360;
      let path = '';
      for (let t = 0; t <= 130; t += 4) {
        const r = 30 + t * 6.2;
        const ang = (baseAngle + t * 1.6) * Math.PI / 180;
        const x = CENTER + r * Math.cos(ang);
        const y = CENTER + r * Math.sin(ang);
        if (t === 0) path += `M ${x.toFixed(1)} ${y.toFixed(1)} `;
        else path += `L ${x.toFixed(1)} ${y.toFixed(1)} `;
      }
      html += `<path d="${path}" stroke-opacity="${0.04 + a * 0.005}"/>`;
    }
    layer.innerHTML = html;
  }

  // ============================================================
  // RENDER PLANETS
  // ============================================================
  function renderPlanets() {
    const layer = $('planetsLayer');
    let html = '';

    for (const loc of LOCATIONS) {
      const { x, y } = getCoords(loc);
      const visitedClass = loc.visited ? 'visited' : '';
      const destroyedClass = loc.destroyed ? 'destroyed' : '';
      const selectedClass = state.selectedId === loc.id ? 'selected' : '';
      const isStation = loc.rim === 'station';
      const isUnknown = loc.rim === 'unknown';

      // pick label position based on which side of center the planet is on
      const dx = x - CENTER;
      const dy = y - CENTER;
      const dist = Math.sqrt(dx * dx + dy * dy) || 1;
      const labelOffset = isStation || isUnknown ? 22 : 18;
      const lx = x + (dx / dist) * labelOffset;
      const ly = y + (dy / dist) * labelOffset;
      const anchor = dx > 30 ? 'start' : dx < -30 ? 'end' : 'middle';
      const baseline = dy > 30 ? 'hanging' : dy < -30 ? 'auto' : 'middle';
      const baselineAttr = baseline === 'hanging' ? 'hanging' : baseline === 'auto' ? 'auto' : 'central';

      let shape;
      if (isStation) {
        // diamond
        shape = `<rect class="planet-dot" x="${x - 6}" y="${y - 6}" width="12" height="12" transform="rotate(45 ${x} ${y})" />`;
      } else if (isUnknown) {
        // question mark in a dashed frame
        shape = `
          <rect class="unknown-marker-frame" x="${x - 18}" y="${y - 18}" width="36" height="36" rx="6" />
          <text class="unknown-marker-q" x="${x}" y="${y + 1}">?</text>
        `;
      } else {
        shape = `<circle class="planet-dot" cx="${x}" cy="${y}" r="6" />`;
      }

      // destroyed gets an X overlay
      const destroyedX = loc.destroyed
        ? `<line class="destroyed-cross" x1="${x - 9}" y1="${y - 9}" x2="${x + 9}" y2="${y + 9}" />
           <line class="destroyed-cross" x1="${x + 9}" y1="${y - 9}" x2="${x - 9}" y2="${y + 9}" />`
        : '';

      // visited ring (orbit-like dashed circle around the planet)
      const visitedRing = loc.visited
        ? `<circle class="planet-ring" cx="${x}" cy="${y}" r="${isStation ? 14 : 11}" />`
        : '';
      const selectionRing = state.selectedId === loc.id
        ? `<circle class="selection-ring" cx="${x}" cy="${y}" r="14" />`
        : '';

      const labelText = loc.destroyed
        ? `${escapeHtml(loc.name)} ✗`
        : `${escapeHtml(loc.name)}${loc.visited ? ' ★' : ''}`;

      html += `
        <g class="planet ${loc.rim} ${visitedClass} ${destroyedClass} ${selectedClass}" data-loc="${loc.id}">
          <circle class="planet-hit" cx="${x}" cy="${y}" r="${isStation || isUnknown ? 26 : 18}" />
          ${shape}
          ${destroyedX}
          ${visitedRing}
          ${selectionRing}
          <text class="planet-label" x="${lx}" y="${ly}" text-anchor="${anchor}" alignment-baseline="${baselineAttr}">${labelText}</text>
        </g>
      `;
    }

    layer.innerHTML = html;
  }

  // ============================================================
  // PAN / ZOOM
  // ============================================================
  const stage = $('mapStage');
  const mapGroup = $('mapGroup');

  function applyTransform() {
    mapGroup.setAttribute('transform', `translate(${state.tx} ${state.ty}) scale(${state.scale})`);
    $('zoomDisplay').textContent = Math.round(state.scale * 100) + '%';
  }

  function clampScale(s) { return Math.max(0.4, Math.min(4.5, s)); }

  function zoomAt(clientX, clientY, deltaScale) {
    const rect = stage.getBoundingClientRect();
    // SVG point under cursor
    const svg = $('map');
    const viewBox = svg.viewBox.baseVal;
    const svgX = ((clientX - rect.left) / rect.width) * viewBox.width;
    const svgY = ((clientY - rect.top) / rect.height) * viewBox.height;

    // Current world point under cursor (before transform reverse)
    // worldX = (svgX - tx) / scale
    const worldX = (svgX - state.tx) / state.scale;
    const worldY = (svgY - state.ty) / state.scale;

    const newScale = clampScale(state.scale * deltaScale);
    state.tx = svgX - worldX * newScale;
    state.ty = svgY - worldY * newScale;
    state.scale = newScale;
    applyTransform();
  }

  function zoomCenter(deltaScale) {
    const rect = stage.getBoundingClientRect();
    zoomAt(rect.left + rect.width / 2, rect.top + rect.height / 2, deltaScale);
  }

  function resetView() {
    state.scale = 1;
    state.tx = 0;
    state.ty = 0;
    applyTransform();
  }

  // wheel zoom
  stage.addEventListener('wheel', (e) => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
    zoomAt(e.clientX, e.clientY, factor);
  }, { passive: false });

  // drag to pan
  stage.addEventListener('mousedown', (e) => {
    // ignore if right-click or modifier
    if (e.button !== 0) return;
    state.isDragging = true;
    state.dragStart = { x: e.clientX, y: e.clientY };
    state.panStart = { x: state.tx, y: state.ty };
    state.dragMoved = false;
    stage.classList.add('dragging');
  });
  window.addEventListener('mousemove', (e) => {
    if (!state.isDragging) return;
    const dx = e.clientX - state.dragStart.x;
    const dy = e.clientY - state.dragStart.y;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) state.dragMoved = true;
    // convert pixel delta to viewBox units
    const rect = stage.getBoundingClientRect();
    const vb = $('map').viewBox.baseVal;
    const sx = vb.width / rect.width;
    const sy = vb.height / rect.height;
    state.tx = state.panStart.x + dx * sx;
    state.ty = state.panStart.y + dy * sy;
    applyTransform();
  });
  window.addEventListener('mouseup', () => {
    state.isDragging = false;
    stage.classList.remove('dragging');
  });

  // touch support
  let lastTouchDistance = 0;
  let touchPanStart = null;
  stage.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
      touchPanStart = {
        x: e.touches[0].clientX, y: e.touches[0].clientY,
        tx: state.tx, ty: state.ty
      };
    } else if (e.touches.length === 2) {
      lastTouchDistance = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
    }
  }, { passive: true });
  stage.addEventListener('touchmove', (e) => {
    if (e.touches.length === 1 && touchPanStart) {
      const dx = e.touches[0].clientX - touchPanStart.x;
      const dy = e.touches[0].clientY - touchPanStart.y;
      const rect = stage.getBoundingClientRect();
      const vb = $('map').viewBox.baseVal;
      state.tx = touchPanStart.tx + dx * (vb.width / rect.width);
      state.ty = touchPanStart.ty + dy * (vb.height / rect.height);
      applyTransform();
    } else if (e.touches.length === 2) {
      const d = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      if (lastTouchDistance) {
        const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        zoomAt(cx, cy, d / lastTouchDistance);
      }
      lastTouchDistance = d;
      e.preventDefault();
    }
  }, { passive: false });
  stage.addEventListener('touchend', () => {
    touchPanStart = null;
    lastTouchDistance = 0;
  });

  // ============================================================
  // TOOLTIPS (hover)
  // ============================================================
  const tt = $('tooltip');
  function showTooltip(loc, e) {
    $('ttName').textContent = loc.name;
    const typeLabel = loc.rim === 'inner' ? 'Inner Rim · Fey Court' :
                      loc.rim === 'mid' ? 'Midreach · Tension Belt' :
                      loc.rim === 'outer' ? 'Outer Rim · Edge & End' :
                      loc.rim === 'station' ? 'Station / Waypoint' :
                      loc.rim === 'unknown' ? 'Unknown · Off-map' :
                      loc.rim === 'void' ? 'Void · The Maw' : '';
      $('ttType').textContent = typeLabel + (loc.visited ? '  ·  ★ VISITED' : '');
    tt.classList.add('show');
    moveTooltip(e);
  }
  function moveTooltip(e) {
    const x = (e.clientX || 0) + 14;
    const y = (e.clientY || 0) + 14;
    tt.style.left = Math.min(x, window.innerWidth - 250) + 'px';
    tt.style.top = Math.min(y, window.innerHeight - 60) + 'px';
  }
  function hideTooltip() { tt.classList.remove('show'); }

  // ============================================================
  // INFO PANEL
  // ============================================================
  function openInfo(loc) {
    state.selectedId = loc.id;
    saveState();

    const panel = $('infoPanel');
    const head = $('infoHead');
    const eyebrow = $('infoEyebrow');
    head.className = 'info-head ' + (loc.rim || '');
    eyebrow.className = 'info-eyebrow ' + (loc.rim || '');

    const typeLabel = loc.rim === 'inner' ? 'Inner Rim · Fey Court' :
                      loc.rim === 'mid' ? 'Midreach · Tension Belt' :
                      loc.rim === 'outer' ? 'Outer Rim · Edge & End' :
                      loc.rim === 'station' ? 'Station · Waypoint' :
                      loc.rim === 'unknown' ? 'Off-Map · Unknown Location' :
                      loc.rim === 'void' ? 'Void · Mawward Unknown' : '';
    $('infoType').textContent = typeLabel;
    $('infoTitle').textContent = loc.name;
    $('infoSubtitle').textContent = loc.subtitle || '';

    $('visitedTag').style.display = loc.visited ? 'inline-flex' : 'none';

    let body = '';
    body += `
      <div class="info-section">
        <div class="info-section-label">Field Notes</div>
        <div class="info-text">${loc.desc}</div>
      </div>
    `;

    // Deity / Court (Inner Rim)
    if (loc.deity) {
      const initial = loc.deity.name.replace(/^The /, '').charAt(0);
      body += `
        <div class="deity-card">
          <div class="deity-sigil">${escapeHtml(initial)}</div>
          <div>
            <div class="deity-name">${escapeHtml(loc.deity.name)}</div>
            <div class="deity-domain">${escapeHtml(loc.deity.domain)}</div>
            ${loc.court ? `<div class="deity-court">⟡ ${escapeHtml(loc.court)}</div>` : ''}
          </div>
        </div>
      `;
    }

    // Known Contacts
    if (loc.contacts && loc.contacts.length) {
      body += `
        <div class="info-section">
          <div class="info-section-label">Known Contacts</div>
          <div class="contact-list">
            ${loc.contacts.map(c => {
              const factionClass = (c.faction || '').toLowerCase().split(/[ ·]/)[0].replace(/[^a-z]/g, '');
              return `
                <div class="contact-card ${factionClass}">
                  <div class="contact-row">
                    <span class="contact-name">${escapeHtml(c.name)}</span>
                    ${c.faction ? `<span class="contact-faction">${escapeHtml(c.faction)}</span>` : ''}
                  </div>
                  ${c.role ? `<div class="contact-role">${escapeHtml(c.role)}</div>` : ''}
                  ${c.desc ? `<div class="contact-desc">${c.desc}</div>` : ''}
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    // Intel & Hooks
    if (loc.intel && loc.intel.length) {
      body += `
        <div class="info-section">
          <div class="info-section-label">Active Intel & Hooks</div>
          <ul class="intel-list">
            ${loc.intel.map(i => `<li class="intel-item">${i}</li>`).join('')}
          </ul>
        </div>
      `;
    }

    // Faction Presence
    if (loc.factions && loc.factions.length) {
      body += `
        <div class="info-section">
          <div class="info-section-label">Faction Presence</div>
          <div class="faction-tags">
            ${loc.factions.map(f => {
              const lower = f.toLowerCase();
              const cls = lower.includes('hostile') || lower.includes('hunting') || lower.includes('destroyed') ? 'hostile' :
                          lower.includes('allied') ? 'allied' :
                          lower.includes('warning') || lower.includes('incoming') || lower.includes('covert') ? 'warning' : '';
              return `<span class="faction-tag ${cls}">${escapeHtml(f)}</span>`;
            }).join('')}
          </div>
        </div>
      `;
    }

    if (state.dmMode && loc.dmNotes) {
      body += `
        <div class="info-section dm">
          <div class="info-section-label">DM Notes — Session Context</div>
          <div class="info-text">${loc.dmNotes}</div>
        </div>
      `;
    } else if (!state.dmMode && loc.dmNotes) {
      body += `
        <div class="info-section">
          <div class="info-section-label">DM Notes</div>
          <div class="info-text" style="color: var(--muted); font-style: italic; font-size: 12.5px;">★ Toggle <strong>DM Mode</strong> in the top bar to reveal session-specific notes for this location.</div>
        </div>
      `;
    }

    $('infoBody').innerHTML = body;
    panel.classList.add('open');
    renderPlanets(); // re-render to update selection highlight
  }
  function closeInfo() {
    state.selectedId = null;
    saveState();
    $('infoPanel').classList.remove('open');
    renderPlanets();
  }
  function openRim(rimKey) {
    const r = RIMS[rimKey];
    if (!r) return;
    openInfo({
      id: 'rim-' + rimKey,
      name: r.name,
      rim: rimKey,
      subtitle: r.subtitle,
      desc: r.desc
    });
  }

  // ============================================================
  // EVENT WIRING
  // ============================================================
  // SVG click delegation
  $('map').addEventListener('mousemove', (e) => {
    const planet = e.target.closest('.planet');
    if (planet) {
      const loc = findLoc(planet.dataset.loc);
      if (loc) showTooltip(loc, e);
      return;
    }
    const core = e.target.closest('.fey-core');
    if (core) {
      showTooltip(findLoc('fey-core'), e);
      return;
    }
    const void_ = e.target.closest('.void-anomaly');
    if (void_) { showTooltip(VOID, e); return; }
    const ring = e.target.closest('.rim-ring');
    if (ring) {
      const r = RIMS[ring.dataset.rim];
      if (r) {
        $('ttName').textContent = r.name;
        $('ttType').textContent = r.subtitle;
        tt.classList.add('show');
        moveTooltip(e);
      }
      return;
    }
    hideTooltip();
  });
  $('map').addEventListener('mouseleave', hideTooltip);

  $('map').addEventListener('click', (e) => {
    if (state.dragMoved) { state.dragMoved = false; return; }

    const planet = e.target.closest('.planet');
    if (planet) { const loc = findLoc(planet.dataset.loc); if (loc) openInfo(loc); return; }

    const core = e.target.closest('.fey-core');
    if (core) { openInfo(findLoc('fey-core')); return; }

    const void_ = e.target.closest('.void-anomaly');
    if (void_) { openInfo(VOID); return; }

    const ring = e.target.closest('.rim-ring, .rim-band');
    if (ring) { openRim(ring.dataset.rim); return; }
  });

  // Top-bar controls
  document.addEventListener('click', (e) => {
    const action = e.target.closest('[data-action]');
    if (action) {
      const a = action.dataset.action;
      if (a === 'zoom-in') zoomCenter(1.25);
      else if (a === 'zoom-out') zoomCenter(1 / 1.25);
      else if (a === 'reset') resetView();
    }
    if (e.target.closest('#infoClose')) closeInfo();
    if (e.target.closest('#dmToggle')) {
      // Password gate — turning ON requires the password; turning OFF is free.
      if (!state.dmMode) {
        const entered = prompt('DM Mode — enter password:');
        if (entered === null) return; // cancelled
        if (entered !== DM_PASSWORD) {
          alert('Incorrect password.');
          return;
        }
      }
      state.dmMode = !state.dmMode;
      saveState();
      $('dmToggle').classList.toggle('on', state.dmMode);
      // re-render currently open panel
      if (state.selectedId) {
        const loc = findLoc(state.selectedId);
        if (loc) openInfo(loc);
      }
    }
    if (e.target.closest('#hintClose')) {
      $('helpHint').classList.add('fade');
    }
  });

  // SEARCH
  const searchInput = $('search');
  const searchResults = $('searchResults');
  function buildSearchIndex() {
    const items = [];
    for (const loc of LOCATIONS) items.push(loc);
    items.push(VOID);
    items.push({ id: 'fey-core', name: 'Fey Court Core', rim: 'inner', subtitle: 'Heart of the Inner Rim' });
    return items;
  }
  const searchIndex = buildSearchIndex();

  function renderSearchResults(query) {
    if (!query) { searchResults.classList.remove('open'); return; }
    const q = query.toLowerCase();
    const matches = searchIndex.filter(loc =>
      loc.name.toLowerCase().includes(q) ||
      (loc.subtitle && loc.subtitle.toLowerCase().includes(q)) ||
      (loc.rim && loc.rim.toLowerCase().includes(q))
    ).slice(0, 12);
    if (!matches.length) {
      searchResults.innerHTML = `<div class="search-result" style="color:var(--muted); cursor:default">No matches for "${escapeHtml(query)}"</div>`;
    } else {
      searchResults.innerHTML = matches.map(m => {
        const t = m.rim === 'inner' ? 'Inner' : m.rim === 'mid' ? 'Midreach' :
                  m.rim === 'outer' ? 'Outer' : m.rim === 'station' ? 'Station' :
                  m.rim === 'void' ? 'Void' : 'Unknown';
        return `<div class="search-result" data-search-id="${m.id}">
          <span>${escapeHtml(m.name)}</span>
          <span class="search-result-type">${t}</span>
        </div>`;
      }).join('');
    }
    searchResults.classList.add('open');
  }
  searchInput.addEventListener('input', (e) => renderSearchResults(e.target.value));
  searchInput.addEventListener('focus', () => { if (searchInput.value) renderSearchResults(searchInput.value); });
  searchInput.addEventListener('blur', () => { setTimeout(() => searchResults.classList.remove('open'), 180); });
  searchResults.addEventListener('click', (e) => {
    const r = e.target.closest('.search-result');
    if (!r || !r.dataset.searchId) return;
    const loc = findLoc(r.dataset.searchId);
    if (loc) {
      openInfo(loc);
      // pan/zoom to it
      flyTo(loc);
      searchInput.value = '';
      searchResults.classList.remove('open');
      searchInput.blur();
    }
  });

  function flyTo(loc) {
    const { x, y } = getCoords(loc);
    const targetScale = Math.max(state.scale, 1.6);
    const vb = $('map').viewBox.baseVal;
    state.scale = targetScale;
    // center the point in the viewport
    state.tx = vb.width / 2 - x * targetScale;
    state.ty = vb.height / 2 - y * targetScale;
    mapGroup.style.transition = 'none';
    requestAnimationFrame(() => {
      mapGroup.style.transition = 'transform 0.6s cubic-bezier(0.32, 0.72, 0.24, 1)';
      applyTransform();
      setTimeout(() => mapGroup.style.transition = '', 700);
    });
  }

  // Keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    if (e.target === searchInput) {
      if (e.key === 'Escape') searchInput.blur();
      return;
    }
    if (e.key === '/') { e.preventDefault(); searchInput.focus(); }
    if (e.key === '0') { resetView(); }
    if (e.key === 'd' || e.key === 'D') {
      if (!state.dmMode) {
        const entered = prompt('DM Mode — enter password:');
        if (entered === null) return;
        if (entered !== DM_PASSWORD) { alert('Incorrect password.'); return; }
      }
      state.dmMode = !state.dmMode;
      saveState();
      $('dmToggle').classList.toggle('on', state.dmMode);
      if (state.selectedId) {
        const loc = findLoc(state.selectedId);
        if (loc) openInfo(loc);
      }
    }
    if (e.key === 'Escape') closeInfo();
    if (e.key === '+' || e.key === '=') zoomCenter(1.25);
    if (e.key === '-' || e.key === '_') zoomCenter(1 / 1.25);
  });

  // ============================================================
  // BOOT
  // ============================================================
  function boot() {
    buildStarfield();
    buildSpirals();
    renderPlanets();
    applyTransform();
    if (state.dmMode) $('dmToggle').classList.add('on');

    // Auto-fade the help hint after 12s
    setTimeout(() => $('helpHint').classList.add('fade'), 12000);
  }

  boot();
})();
</script>
</body>
</html>
