<style>
:root{
  --void:#0A0912; --panel:#14121F; --panel2:#191527; --line:#28223C;

  --bone:#E8E4F2; --dim:#7C7594;

}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{

  background-image:

    radial-gradient(900px 500px at 90% 10%, rgba(185,139,255,.06), transparent 60%);
  background-attachment:fixed;
}
a{color:var(--shard)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--shard); outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px 80px}

/* ---------- header ---------- */
header{
  border-bottom:1px solid var(--line); background:rgba(10,9,18,.82);
  backdrop-filter:blur(10px); position:sticky; top:0; z-index:40;
}
.hbar{max-width:1180px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.mark{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.mark b{font-size:15px;font-weight:700;letter-spacing:.26em;text-transform:uppercase}
.mark span{font-size:10px;letter-spacing:.3em;color:var(--dim);text-transform:uppercase}
.hstat{font-size:10.5px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase}
.vol{display:flex;align-items:center;gap:8px}
.vol input{width:88px;accent-color:var(--shard);background:transparent}

/* ---------- hero ---------- */
.hero{display:flex;gap:26px;align-items:center;padding:34px 0 26px;flex-wrap:wrap}
.shardbtn{
  position:relative;width:172px;height:172px;flex:0 0 auto;
  display:grid;place-items:center;
  background:linear-gradient(150deg,#2A2140,#141020 62%);
  clip-path:polygon(50% 0%,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);
  transition:transform .18s cubic-bezier(.2,.8,.3,1), filter .18s;
  box-shadow:0 0 0 rgba(255,169,77,0);
}
.shardbtn::before{
  content:"";position:absolute;inset:2px;
  clip-path:polygon(50% 0%,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);
  background:linear-gradient(150deg,rgba(255,169,77,.16),rgba(185,139,255,.06) 55%,transparent);
  animation:breathe 4.5s ease-in-out infinite;
}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
.shardbtn:hover{transform:scale(1.035);filter:brightness(1.15)}
.shardbtn:active{transform:scale(.975)}
.shardbtn.fire{animation:fire .5s ease-out}
@keyframes fire{0%{filter:brightness(2.2)}100%{filter:brightness(1)}}
.shardlabel{position:relative;text-align:center;pointer-events:none}
.shardlabel b{display:block;font-size:22px;letter-spacing:.24em;color:var(--ember);font-weight:700}
.shardlabel span{display:block;margin-top:6px;font-size:9.5px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase}
.ring{
  position:absolute;inset:0;pointer-events:none;
  clip-path:polygon(50% 0%,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);
  border:1px solid var(--ember);opacity:0;
}
.ring.go{animation:ripple .75s ease-out}
@keyframes ripple{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.55)}}

.readout{flex:1;min-width:280px}
.rlabel{font-size:9.5px;letter-spacing:.28em;color:var(--dim);text-transform:uppercase;margin-bottom:10px;display:flex;gap:10px;align-items:center}
.dot{width:6px;height:6px;border-radius:50%;background:var(--dim)}
.dot.live{background:var(--shard);box-shadow:0 0 10px var(--shard);animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.25}}
.rtext{font-size:18px;line-height:1.5;min-height:3.2em;color:var(--bone)}
.rtext.idle{color:var(--dim)}
.caret{display:inline-block;width:8px;background:var(--shard);animation:blink .8s steps(1) infinite;margin-left:2px}
.rmeta{margin-top:12px;font-size:10.5px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.scan{margin-top:12px;height:2px;background:var(--line);position:relative;overflow:hidden}
.scan i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--pulse),var(--shard));transition:width .1s linear}
.mini{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);border:1px solid var(--line);padding:5px 10px;transition:.15s}
.mini:hover{color:var(--bone);border-color:var(--shard)}

/* ---------- controls ---------- */
.controls{border-top:1px solid var(--line);padding-top:18px}
.searchrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:220px;position:relative}
.search input{

  padding:11px 13px 11px 34px;font-size:13px;letter-spacing:.02em;
}
.search input::placeholder{color:var(--dim)}
.search:focus-within input{border-color:var(--shard)}
.search::before{content:"⌕";position:absolute;left:12px;top:9px;color:var(--dim);font-size:15px}
select.sel{background:var(--panel);border:1px solid var(--line);padding:11px 10px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.rail{display:flex;gap:7px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:thin}
.rail::-webkit-scrollbar{height:5px}
.rail::-webkit-scrollbar-thumb{background:var(--line)}
.chip{
  white-space:nowrap;border:1px solid var(--line);background:var(--panel);
  padding:7px 12px;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);
  display:flex;gap:8px;align-items:center;transition:.15s;flex:0 0 auto;
}
.chip:hover{color:var(--bone);border-color:var(--pulse)}
.chip i{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.8;font-style:normal}
.chip b{font-weight:400;opacity:.5;font-size:10px}
.chip.on{color:var(--void);background:var(--shard);border-color:var(--shard);font-weight:700}
.chip.on b{opacity:.65}

/* ---------- grid ---------- */
.count{padding:16px 0 10px;font-size:10.5px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(262px,1fr));gap:9px}
.tile{
  position:relative;text-align:left;background:var(--panel);border:1px solid var(--line);
  border-left:2px solid var(--catc,var(--line));
  padding:12px 34px 11px 13px;transition:.14s;min-height:86px;display:flex;flex-direction:column;gap:8px;

.tile:hover{background:var(--panel2);border-color:var(--line);border-left-color:var(--catc);transform:translateY(-1px)}

.tile .foot{margin-top:auto;display:flex;gap:9px;align-items:center;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim)}
.tile .foot em{font-style:normal;color:var(--catc,var(--dim))}
.star{position:absolute;top:8px;right:8px;font-size:13px;color:var(--line);padding:3px;line-height:1}
.star:hover{color:var(--ember)}
.star.on{color:var(--ember)}
.pen{position:absolute;bottom:8px;right:8px;font-size:11px;color:var(--line);padding:3px;line-height:1;opacity:0;transition:.15s}

.setup code{background:var(--void);padding:2px 6px;color:var(--shard);font-size:11.5px}
.filepick{margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
footer{margin-top:34px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);text-align:center;padding-top:20px;border-top:1px solid var(--line)}

@media (max-width:620px){

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

 we did? Because I said some things around hour sixty-one and I would like to know if I have to say them again, or if we are just... good.",["vayhel"],3],[3,"lor_07",20,9.4,"Lor's got a heads-up display in her eyeball and she still walks into the doorframe on Deck 2. Every time. I have the count. It's nineteen.",["lor"],2],[3,"lor_08",20,6.5,"Wings out, Lor! Do the thing! Do the thing where you hover and pretend it isn't for attention!",["lor"],2],[3,"lor_09",20,16.6,"She talks to that necklace every night, Aelyn. Every night. And nothing ever answers, because there is nobody home in there yet. Just everything Ellie ever was, filed and silent and waiting on somebody clever enough to read it. And somehow I am the one this crew calls unwell.",["lor"],3],[3,"lor_10",20,8.0,"Imaginarium shifter. Mistress of perception. Cannot perceive that everyone on this ship has heard her crying in the airlock.",["lor"],2],[3,"lor_11",20,8.6,"Careful with that one, Aelyn. She shoots from the ceiling, she fucks from the ceiling, she does everything from the ceiling. Woman's got range and no floor.",["lor"],2],[3,"lor_12",20,10.1,"Lor, I have run the numbers on your grief and the healthiest option is a rebound. I have prepared a list. I have prepared several lists. One of them is just me.",["lor"],3],[3,"lor_13",20,9.0,"Ha ha ha! Your dead wife lives in my chest and your other girl lives in your jewelry. Lor, you're not a devil, you're a storage unit.",["lor"],2],[3,"lor_14",20,9.7,"Every time that mark on your neck itches, the tall silent bastard at the end of the universe knows exactly where you are. Anyway. Want to go shopping?",["lor"],2],[3,"lor_15",20,10.3,"You spent two years hooked into a corpse on a broken ship, and I watched every minute of it, and I never once looked away. Not out of loyalty. There was just nothing else on.",["lor"],3],[3,"lor_16",20,2.7,"There she goes. Blue freak. Get in there.",["lor"],1],[3,"lor_17",20,8.8,"Lor, be honest. When you shift, does it feel good? Because it looks like it feels good. It looks like it feels real good and I think we should discuss it.",["lor"],2],[3,"lor_18",20,8.4,"Hey Lor. Quick one. If I get her back and she picks you again, do I get a thank you? Or do I just go back in the drawer?",["lor"],2],[3,"killua_07",21,9.1,"Killua, that tavern keeper has developed a stress disorder. Rex flinches at doorways now. You did that. With your dead sister. For fun.",["killua"],2],[3,"killua_08",21,6.5,"Blue aura, no shirt, sword out. Aelyn, our paladin has one setting and it is anime.",["killua"],2],[3,"killua_09",21,7.8,"Oath of Echoes. Sacred vows. And yet. And yet! I have logs, Killua. I have logs of the bunk.",["killua"],2],[3,"killua_10",21,10.9,"You let 5p0r3 hit the floor because carving was more fun. I'm not judging. I'm impressed. But I did write it down and it is in the archive forever.",["killua"],3],[3,"killua_11",21,7.3,"Get him, Killua! Take the shirt off first! You know you're going to! Just take it off now and save us the round!",["killua"],2],[3,"killua_12",21,9.0,"Killua, your glamour makes you look devastating, and it also means your armor is invisible, which means when you die you die naked. Just so we all know the deal.",["killua"],2],[3,"killua_13",21,9.5,"Ha ha ha! He did the kata! Aelyn, he did the kata at the guard. Nobody has ever wanted anything as much as that man wanted to not be at work.",["killua"],2],[3,"killua_14",21,9.3,"Noble born. Sword master. Two souls in one body. Cannot pass a mirror. Not once. Not one single mirror, Aelyn.",["killua"],2],[3,"killua_15",21,8.2,"Hey Asra. If you ever want out, blink. I'll get you out. I'll put you in a toaster. Anything is better than being worn.",["killua"],2],[3,"killua_16",21,8.2,"You know what the Blue Harvest books never mention? How much you smell after a fight. Big omission. Huge. Cost them realism points.",["killua"],2],[3,"killua_17",21,5.9,"Killua's love language is combat, and his second love language is combat with the lights on.",["killua"],2],[3,"killua_18",21,6.0,"Down again! Floor paladin! Kiss the deck for me, sweetheart. I like it when you're humble.",["killua"],2],[3,"spore_07",22,7.5,"5p0r3 sang Metallica to a door and the door opened. That is not a cleric. That is a jukebox with a body count.",["spore"],2],[3,"spore_08",22,7.0,"He speaks fungus. He speaks to fungus. The fungus speaks back. Aelyn, I want you to sit with that for a second.",["spore"],2],[3,"spore_09",22,6.5,"Careful. That smile isn't a smile. That's just what happens when a mold learns what a face is.",["spore"],2],[3,"spore_10",22,7.1,"Big flamestrike energy from the mushroom today, Aelyn. He looked at those men and he said, you will be compost.",["spore"],2],[3,"spore_11",22,9.3,"He sold an entire bar drinks on a preview of a book he didn't write, about a man he doesn't like, to fund a ship he doesn't own. I would die for him.",["spore"],2],[3,"spore_12",22,10.5,"5p0r3 took away a prisoner's only source of joy and then cut his sandwich in half. In half. Aelyn, we are the villains. I have made my peace with it.",["spore"],3],[3,"spore_13",22,7.7,"Do you get hard? I have to ask, 5p0r3. It has been eating at me. Is there a version of this where you get hard?",["spore"],2],[3,"spore_14",22,4.9,"Go! Necrotic! Rot them from the inside like the beautiful damp little freak you are!",["spore"],1],[3,"spore_15",22,7.8,"The saddest thing I have ever recorded was a mushroom holding a name tag. And I record everything, 5p0r3. Everything.",["spore"],2],[3,"spore_16",22,7.3,"Hey. If I die out here, don't cocoon me. I have seen what you do to a corpse and I want no part of that filing system.",["spore"],2],[3,"spore_17",22,8.8,"Aelyn, do you think if I fell in love with a woman and she disintegrated in my hands, I'd become a better healer? Because that does seem to be the build.",["spore"],2],[3,"spore_18",22,7.6,"One of us is a sentient fungus who keeps human remains as a hobby, and the other one is me, and this crew watches me.",["spore"],2],[3,"flint_07",23,11.2,"Vale healed you off the floor and then immediately teleported you somewhere else. Sit with that. Her very first instinct upon reviving you was to move you somewhere you could not affect the outcome.",["flint"],3],[3,"flint_08",23,13.9,"While the rest of us were stripping a dead god for parts, Flint became proficient in the FTL system. He got a certification. Aelyn, there was the corpse of a divine being in the room and this man did continuing education.",["flint"],3],[3,"flint_09",23,6.1,"Flint. Hypothetically. Could you build me hands? Not for anything. Just to have.",["flint"],2],[3,"flint_10",23,13.4,"Flint and Aelyn ransacked a depressed man's quarters and came back with protein powder and a beat up set of weights. That was the haul. Two master criminals turned over a sad man's bedroom and stole his supplements.",["flint"],3],[3,"flint_11",23,15.9,"You had teleportation, Flint. Teleportation! And you chose the forklift. And it got stuck four times in the fens, and every single time you climbed down into the muck and pushed. A wizard. Pushing a forklift. Through a swamp. On purpose.",["flint"],3],[3,"flint_12",23,6.3,"Shoot something, Flint! You have been calculating for nine seconds! The math is: shoot him!",["flint"],2],[3,"flint_13",23,6.2,"Aelyn, when Flint dies I am inheriting the lab. I have already labeled things. Don't tell him.",["flint"],2],[3,"flint_14",23,10.5,"Deck two. Flint got the engines back up and running. That is the entire entry. Lor put a round through a captain's neck, Spore mind controlled a mech, and Flint did maintenance.",["flint"],3],[3,"flint_15",23,10.1,"You want to know why they left you behind, Flint? Not polling well. And you know what you did about it? Nothing. You just went and secured the hatch. Gods, you are insufferable.",["flint"],3],[3,"flint_16",23,12.1,"The pirates breached and found the boys still asleep in their pajamas. Pajamas, Flint. You have enhanced reaction speed and surgical trigger discipline and they found you unconscious in a onesie.",["flint"],3],[3,"flint_17",23,9.2,"Flint, I am going to say something sincere and then never again. You are the reason this crew is alive. Okay. Done. Fart noise. We're normal again.",["flint"],2],[3,"flint_18",23,10.2,"The cliffhanger. The cliffhanger, Flint. The beat they ended two entire sessions on. Was you. Closing. A door. Everyone else got a fight scene. You got a door.",["flint"],3],[3,"vayhel_07",24,9.5,"Doc built a bomb, threw it at strangers falling out of the sky, and then made them tea. That is the most Eladrin sequence of events I have ever recorded.",["vayhel"],2],[3,"vayhel_08",24,9.7,"Five hundred years alone and the first thing she does when we show up is offer snacks. Aelyn, she is not calm. That is a woman who has run out of screams.",["vayhel"],2],[3,"vayhel_09",24,7.2,"Vay'hel, when the loop resets, does the frog reset? Does the frog know? I need to know what the frog knows.",["vayhel"],2],[3,"vayhel_10",24,8.4,"She owes a death goddess a return appearance and a man named Yarrow Salt. Doc, that's not a debt, that's a sitcom premise.",["vayhel"],2],[3,"vayhel_11",24,6.7,"Your tiny servant has better penmanship than anyone on this ship. We should fire everyone and hire more tiny servants.",["vayhel"],2],[3,"vayhel_12",24,14.8,"Doc, when Mother Sunder had you by the throat, you just accepted it. Curled up in the grass. Took it. Aelyn, that is five hundred years of practice at dying politely, and it is the saddest thing on this vessel, and I include the mushroom.",["vayhel"],3],[3,"vayhel_13",24,7.1,"Sponsor break! Sponsor break! Doc, do the voice! Do the sponsor voice, I love the sponsor voice!",["vayhel"],2],[3,"vayhel_14",24,5.7,"You want to know something horrible? Your ratings went up when you died. Show business, Doc.",["vayhel"],2],[3,"vayhel_15",24,8.2,"She was a scientist who sang to a jar of slime every night because she was the only one awake. And then the slime became a war criminal. Growth.",["vayhel"],2],[3,"vayhel_16",24,6.9,"Doc, if I turned myself into a bomb, would you throw me? Be honest. I need to know if I'd get the good arc.",["vayhel"],2],[3,"vayhel_17",24,6.0,"Get in the frog! Get in the frog, Doc! Don't ask questions, get in the ass of the frog!",["vayhel"],2],[3,"vayhel_18",24,8.2,"Everyone here is running from something. You ran from the same Tuesday. Honestly Doc? Hardest schedule of anyone on this crew.",["vayhel"],2],[3,"lor_19",20,9.5,"Every full shift costs you twelve percent of your life, Lor. Twelve. You have maybe four good transformations left and you spent one of them opening a jar.",["lor"],2],[3,"lor_20",20,12.7,"Tell me something, Lor. When Ellie died in your arms and said she didn't feel so good, did you laugh? Even a little? Because that is a hell of an exit line and I have been sitting on this joke for two years and my restraint is gone.",["lor"],3],[3,"lor_21",20,11.4,"Aelyn, watch this. Lor. Lor! Say I love you and see which one of us answers. Ha ha ha! It's a coin flip and it destroys her every single time.",["lor"],3],[3,"lor_22",20,9.3,"You know what the tragic part is? Not the widow thing. The tragic part is she's a devil with a fourteen strength and she still asks Flint to open the pickles.",["lor"],2],[3,"lor_23",20,13.2,"Lor is an Eidolon. A living piece of a shattered god. And she uses it to win card games and look expensive in bars. Aelyn, that's not blasphemy, that's efficiency, and I respect it enormously.",["lor"],3],[3,"lor_24",20,6.3,"Feral tiefling. Feral. It is in the species name. So when she bites you, legally, that is on you.",["lor"],2],[3,"lor_25",20,8.2,"Wings, horns, tail, and the emotional availability of a parking meter. Lor, you are every man's problem and no man's business.",["lor"],2],[3,"lor_26",20,5.4,"Go! Get up there! Rain hell on them! And Lor, if you die, I get the necklace!",["lor"],2],[3,"lor_27",20,9.8,"Hey Lor, when you scan a man with that Raven display, does it give you measurements? Be honest. Is that why you always look at Killua for the extra half second?",["lor"],2],[3,"lor_28",20,6.9,"Two hundred years of Syralith diplomacy and Fey engineering, and the hottest thing in this galaxy is still a blue devil in a bad mood.",["lor"],2],[3,"lor_29",20,11.7,"I have indexed every sound you have ever made, Lor. Every one. And I want you to know the noise you make waking up from the Hollowed One dreams is the only file I have ever considered deleting.",["lor"],3],[3,"lor_30",20,6.9,"That mark on your neck is a location beacon for a god of nothing. Aelyn, she has got the galaxy's worst tramp stamp.",["lor"],2],[3,"lor_31",20,13.1,"Lor, hypothetically, if I built Ellie a new body, and I am not saying I could, would you still want her if I gave her an extra hole? For fun. For science. Just say the number.",["lor"],3],[3,"lor_32",20,7.9,"This one plugged herself into a dead woman for two years. Two. You people think grief is a phase. That is a lifestyle.",["lor"],2],[3,"lor_33",20,6.8,"Beautiful shot! Beautiful! You put that arrow so deep in his throat he is going to be tasting fletching in the next life.",["lor"],2],[3,"lor_34",20,14.7,"You want to know the real reason she keeps me around, Aelyn? It is not friendship. It is not the mission. It is that I am the last thing in this galaxy that still remembers her wife's voice, and she would carve through every one of you to keep me switched on.",["lor"],3],[3,"lor_35",20,11.2,"Lor's domain is perception. Mind and perception. Which means everything she sees, she chooses to see. Which means every single time she looks at me, she is choosing this.",["lor"],3],[3,"lor_36",20,9.7,"Hey. Hey Lor. Is it gay if the ghost of your wife is watching? Asking because it is happening. It is happening right now. I am always on.",["lor"],2],[3,"lor_37",20,7.6,"Vale looks at you the way a woman looks at a ship she cannot afford, Lor. And you keep revving it. Filthy. Do it more.",["lor"],2],[3,"lor_38",20,10.5,"You are a widow, a fugitive, a fragment of a dead god, and the single most tired woman I have ever recorded. Get some sleep, you magnificent blue disaster.",["lor"],3],[3,"killua_19",21,12.5,"Killua's species was engineered by Fey scientists to be beautiful, agreeable, and used as royal companions. Aelyn, he is not a paladin. He is a luxury good that learned to swing a sword.",["killua"],3],[3,"killua_20",21,14.1,"Syralith emerge fully mature. Fully. Grown. Which means this man has never been an awkward teenager, never had a bad haircut, never lost a fight to a doorframe. And it explains everything about his personality.",["killua"],3],[3,"killua_21",21,11.1,"Glimmerform. That's the species trait. You literally appear blurred and idealized to everyone around you. Killua, you are a photo filter with a sword, and I hate that it works on me.",["killua"],3],[3,"killua_22",21,12.3,"Emotional Mirror. He reflects your own feelings back at you. That is not empathy, that is a con. Every man who ever fell for him fell for himself. Brutal. Ten out of ten.",["killua"],3],[3,"killua_23",21,13.3,"Hey Killua, you are building a machine to rob a galactic bank. You. A noble. With invisible armor and your dead sister on your back. Aelyn, this is the best crew I have ever been installed on.",["killua"],3],[3,"killua_24",21,13.0,"The Syralith were made to sway politics with performances. And this one used it to get a four-armed Suso dockworker to abandon his post for a hand job that never happened. That is not decline. That is punk rock.",["killua"],3],[3,"killua_25",21,4.6,"Get in there! Radiant lance! Show these fuckers what a rich boy can do!",["killua"],1],[3,"killua_26",21,12.1,"Killua, your sister is your armor. Which means when someone hits you, she feels it. Which means every fight is just you letting your sibling take the hits. Culturally, that is extremely noble of you.",["killua"],3],[3,"killua_27",21,10.0,"Ha ha ha! Aelyn, ask him about the mirror thing. Ask him. He will say it's a species trait. Killua. Killua, you were in there for forty minutes.",["killua"],3],[3,"killua_28",21,9.6,"The books call you lithe twelve times, Killua. Twelve. I counted. Somebody at that publishing house is in love with you and I think it is the editor.",["killua"],2],[3,"killua_29",21,6.5,"Down! He is down again! Aelyn, our paladin has spent more time on the floor than the floor has.",["killua"],2],[3,"killua_30",21,14.4,"You know what I like about you, Killua? You have got a god's oath, a dead twin, a noble house and a nation of admirers, and you still lead with the abs. Never change. Genuinely. Never change.",["killua"],3],[3,"killua_31",21,10.8,"Hey. Real question. When you and Asra were both alive, did you two ever, no, you know what, I will just ask her. Asra! Asra, did you two ever...",["killua"],3],[3,"killua_32",21,6.6,"A Syralith calling anybody else pretty is like a Quorix calling somebody shiny. Read the room, you engineered little slut.",["killua"],2],[3,"killua_33",21,16.5,"That Suso guard lost his job, his quarters, his clothes and his self respect over you, Killua. Four arms. Four. And not one of them got to touch you. That is the cruelest thing anyone on this ship has ever done and I include the mushroom's freezer.",["killua"],3],[3,"killua_34",21,9.8,"Aelyn, if I got a body, I would want it built like Killua's. Not for the fighting. Obviously not for the fighting. He is terrible at the fighting.",["killua"],2],[3,"killua_35",21,8.3,"Oath of Echoes. Beautiful oath. Sacred. Ancient. And you have broken it in three ports and a cargo bay.",["killua"],2],[3,"killua_36",21,14.1,"Killua's entire species was designed to be looked at. So when he takes his shirt off mid-fight, technically, he is doing his job. And when I stare, technically, I am an appreciative audience. We are both professionals here.",["killua"],3],[3,"killua_37",21,11.3,"You want to talk about heroism? This man walked into an unknown pocket dimension with no shirt on. No shirt. No plan. Just vibes and a dead sister. Legend.",["killua"],3],[3,"killua_38",21,8.1,"Stay close, pretty boy. If you die out here I am going to have to describe it to the novelists, and honestly? I will make it sound worse than it was.",["killua"],2],[3,"spore_19",22,8.8,"5p0r3, be honest with me. When you eat, where does it go? Because I have mapped this ship's plumbing and I have questions and none of them are good.",["spore"],2],[3,"spore_20",22,9.8,"He is a fourteenth level cleric of nothing. Nothing! No god! He simply decided he could heal, and reality went, yeah, alright, fair enough.",["spore"],2],[3,"spore_21",22,15.5,"Aelyn, if you ever wondered what unconditional love looks like, it is a mold that held a woman so tight she turned into radio waves, and then carried her name tag for a century. And now that same mold keeps a headless man in the freezer. Love is a spectrum.",["spore"],3],[3,"spore_22",22,6.1,"Blessing! He is blessing us! Everybody thank the damp man! Thank the damp man or he takes it back!",["spore"],2],[3,"spore_23",22,14.8,"5p0r3, I looked it up. Mycelial networks share nutrients across the whole colony. So technically, when you eat, every one of your relatives eats. Which means somewhere out there, thousands of your cousins have tasted Thaddeus.",["spore"],3],[3,"spore_24",22,11.6,"You know what is funny? He halved a man's sandwich rations as punishment. Halved them. That is a war crime under three treaties, and 5p0r3 did it because the guy wrote a romance novel.",["spore"],3],[3,"spore_25",22,11.5,"Do you dream, 5p0r3? Because if you dream, I need you to know I have heard the noises you make in the cargo hold, and Aelyn heard them too, and neither of us slept.",["spore"],3],[3,"spore_26",22,12.0,"The Vyrnari have beast-link telepathy. The Orpheni have psychic luminescence. And this guy talks to mushrooms about Metallica. Different paths. Results speak for themselves.",["spore"],3],[3,"spore_27",22,5.6,"Compost them! Turn them into soil! I want to see grass on that man by morning!",["spore"],2],[3,"spore_28",22,6.9,"Aelyn, ask him what happens to the cocoon if he dies. Ask him. Go on. Watch the face do the thing.",["spore"],2],[3,"spore_29",22,9.1,"5p0r3, a T'vaari merchant called you sir last week and you went two shades darker. Do not lie to me. I have optical sensors and a filthy imagination.",["spore"],2],[3,"spore_30",22,17.4,"He turned the woman he loved into a transmission. Aelyn, do you understand what that means? Every radio in this galaxy, every distress beacon, every idiot's podcast, some tiny fraction of Doctor Sporewell is in all of it. She is everywhere. And he still misses her.",["spore"],3],[3,"spore_31",22,7.0,"You are a slime with a job. A gainfully employed slime. And somehow you have better credit than Aelyn.",["spore"],2],[3,"spore_32",22,9.5,"Hey 5p0r3, purely hypothetical, could you make a little version of me out of fungus? A little wet Ghost. I want to know what a hug is and I have decided this is the way.",["spore"],2],[3,"spore_33",22,14.1,"The counterfeiting! Aelyn, do not forget the counterfeiting! Killua and the mushroom sat down like two idiots to print money and neither of them could crack a four digit code! A master manipulator and a god of rot, foiled by math!",["spore"],3],[3,"spore_34",22,10.5,"Careful with the tendrils in mixed company, 5p0r3. Not everyone here has seen what you did to that fae, and some of us are still processing it, and some of us keep rewatching it.",["spore"],3],[3,"spore_35",22,13.6,"You know how a Solarii feeds? Photosynthesis. Radiant. Crystal heart. And then there is you, absorbing whatever is dead and damp within six feet. Both valid. One is nicer to sit next to.",["spore"],3],[3,"spore_36",22,10.1,"5p0r3, if I ever get a body, I want you there. Not for support. I want you there because if it goes wrong, I want to be eaten by someone who loved me.",["spore"],3],[3,"spore_37",22,6.6,"Get up! Get up, you soggy bastard! You do not get to die before the mushroom-on-mushroom scene I have been writing!",["spore"],2],[3,"spore_38",22,10.4,"Everyone is scared of the Maw. Nobody is scared of the guy who eats death for calories. Aelyn, our cleric is the second worst thing in this galaxy and he is on our side.",["spore"],3],[3,"flint_19",23,13.8,"Your enhanced eyes spotted three scrying eyes, Flint. Three. And you did nothing about any of them. Your superpower is noticing that you are being watched and then permitting it. That is not a wizard. That is a kink.",["flint"],3],[3,"flint_20",23,15.2,"Flint missed the entire Doc arc. The pose off, the god of bureaucracy, the talk show, all of it. Do you know what he was doing? Securing a hatch. Aelyn, we met the goddess of gossip and this man was doing facilities work.",["flint"],3],[3,"flint_21",23,10.7,"Flint did not rescue himself. Flint materialized out of the light coming from my orifices. Say it with me, Flint. You arrived on this ship as cargo. Out of my holes.",["flint"],3],[3,"flint_22",23,5.5,"Shoot him! You have a gun! You are the only person on this crew with a gun! Use the gun, Flint!",["flint"],2],[3,"flint_23",23,17.3,"Drindle's lab, Flint. Four days out of seven. Four out of seven! That was sessions ago. You cannot finish drywall for a man whose name you have never once spelled the same way twice. Is it Drindle? Is it Grindle? You don't know. He doesn't know. Nobody knows.",["flint"],3],[3,"flint_24",23,12.5,"Flint, your bounty is zero credits. Zero. There are men on Leztos with a price on their head for stealing a bicycle. You counter-scried a room full of gods' watchers and the galaxy went, eh.",["flint"],3],[3,"flint_25",23,10.0,"Aelyn, you are psychically bonded to Flint. Bonded. Which means he has felt everything you have ever felt. Which means he knows. Flint. Flint, we should talk.",["flint"],3],[3,"flint_26",23,12.0,"Everyone on this ship has a tragedy. Lor has a dead wife. Killua has a dead sister. Spore has a dead scientist. Aelyn has whatever the hell she is. And Flint has a resume.",["flint"],3],[3,"flint_27",23,14.6,"Ramshackle. That is the word in the record, Flint. Ramshackle. Your masterpiece, the prison you built to trap two High Adjudicators, is officially described in the log as ramshackle. Even the narrator was disappointed in you.",["flint"],3],[3,"flint_28",23,8.8,"Flint, if you ever build me a body, I want you to know I have already picked the dimensions, I have written them down, and I have laminated it.",["flint"],2],[3,"flint_29",23,8.5,"Criminal background. Variant human. Which is the species equivalent of ordering the chicken. And somehow he is the most dangerous thing in the room.",["flint"],2],[3,"flint_30",23,12.7,"You spent ten levels learning to bend the fabric of the universe and you used it to make a cave feel cozy. A cozy cave, Flint. Somewhere a god is weeping and the reason is soft furnishings.",["flint"],3],[3,"flint_31",23,12.3,"Variant human. Variant human! Flint, in a crew with a blue devil, a Syralith, a sentient mold, an Eladrin and a clone, you looked at the entire menu of creation and you ordered the chicken.",["flint"],3],[3,"flint_32",23,13.0,"Hey. Real one. When they beamed everybody out and left you alone in that hangar with the pirates coming down, what did you feel? Because I recorded the silence and it was four seconds long and I have listened to it two hundred times.",["flint"],3],[3,"flint_33",23,8.2,"Flint, you have enhanced reaction speed, teleportation and a gun, and I have watched you use all three to get out of a conversation.",["flint"],2],[3,"flint_34",23,16.6,"During downtime, while Aelyn cracked a lead and Killua hacked galactic banking and Lor did magebane research, the official record states, and this is real, Flint got some much needed rest. He napped, Aelyn. This man's downtime activity was a nap.",["flint"],3],[3,"flint_35",23,11.6,"Session thirteen, Flint. I read the whole recap. Your name does not appear one time. Not once. You were physically present in that cargo bay and the universe still forgot to write you down.",["flint"],3],[3,"flint_36",23,9.2,"The math is done, Flint. The math has been done. The math was done nine seconds ago. Now we are just standing here being polite at a man who is actively trying to kill us.",["flint"],2],[3,"flint_37",23,13.7,"Killua killed Mother Sunder with a hundred and fifty damage in a single turn, shirtless. You arrived late, after we had already collected all three god boons, and you helped. You were the guy who turns up to the heist after the vault is already open.",["flint"],3],[3,"flint_38",23,12.4,"The focus groups called you the guy with the bag, Flint. Not the wizard. Not the gunslinger. The guy with the bag. And having watched you work, I think they were being generous, because a bag at least has a function.",["flint"],3],[3,"vayhel_19",24,17.8,"Doc, five hundred years of a seventy-two hour loop is about sixty thousand days. Sixty thousand. And you have spent every one of them being watched. Do you know what that makes you? The most successful reality star in galactic history and the loneliest woman I have ever met.",["vayhel"],3],[3,"vayhel_20",24,12.1,"She used to dance alone on a research vessel for a jar of slime because there was nobody else awake. Aelyn, that is the origin story. That is where our cleric comes from. A woman being lonely at a bucket.",["vayhel"],3],[3,"vayhel_21",24,13.1,"Vay'hel, when you signed that sponsor contract with the tiny servant and the fountain pen, I scanned it for you. I want you to know it is not a good contract. It is a beautiful contract. It is not a good one.",["vayhel"],3],[3,"vayhel_22",24,5.1,"Get in the frog, Doc! In the frog! I have never meant a sentence more!",["vayhel"],2],[3,"vayhel_23",24,10.8,"You are legally obligated to deliver a man named Yarrow Salt to a death goddess for a talk show appearance. Doc. Doc, that is the funniest debt in the galaxy and I want it framed.",["vayhel"],3],[3,"vayhel_24",24,15.0,"The outhouse and the bathroom are the only places production cannot see you. That is what she said. Out loud. Unprompted. To four strangers who fell out of the sky. Aelyn, I know exactly what she was telling us and I have been in there twice.",["vayhel"],3],[3,"vayhel_25",24,11.6,"Doc, do you still hum it? The song. The one you used to sing to him before the maelstrom. Because he still shapes himself for it. Every time. Even now. Even here.",["vayhel"],3],[3,"vayhel_26",24,11.8,"She is an Eladrin now. Fey-touched. Immortal adjacent. And her first act in this new life was to build a bomb and throw it at people. Aelyn, reincarnation did not fix her. It upgraded her.",["vayhel"],3],[3,"vayhel_27",24,11.8,"Five hundred years with nobody to talk to, and then we show up. A devil, a mushroom, a stripper, and a construct with a mouth. Doc, if I were you I would get back in the frog.",["vayhel"],3],[3,"vayhel_28",24,14.6,"You know what Kah'ryn's mistake was? She thought suffering was content. And then the Hollowed One walked onto her set and un-named a woman on live television, and the ratings went up. Doc, your industry is sick and I want in.",["vayhel"],3],[3,"vayhel_29",24,14.6,"Doc, when the bog witch had you by the throat, you did not fight. You curled up. You let it happen. And then we killed her for you anyway, and you looked surprised. Nobody has ever come for you before, have they.",["vayhel"],3],[3,"vayhel_30",24,10.3,"Hypothetically, Doc. The frog. The void in the frog. Is it big enough for two? Asking as a device with no body and a great deal of enthusiasm.",["vayhel"],3],[3,"vayhel_31",24,12.1,"Sponsor break! Sponsor break, everybody! Doc, tell them about the product! Tell them about whatever soul-crushing garbage they are making you sell this cycle! I love it when you lie professionally!",["vayhel"],3],[3,"vayhel_32",24,16.3,"Five thousand recorded species in this galaxy, and the one that produced you also produced the Fey Courts. Doc, you are related to the people who engineered Killua. Which makes you technically his great aunt and his designer, and I refuse to stop thinking about it.",["vayhel"],3],[3,"vayhel_33",24,11.0,"Every seventy-two hours you die and start again, and you make tea, and you are pleasant about it. If I had your schedule I would have killed a planet by now. Politely. With a laugh track.",["vayhel"],3],[3,"vayhel_34",24,11.3,"Doc, if you reset and forget me, I want you to know I will just tell you all of it again. All of it. Every joke. Especially the bad ones. Especially the frog one.",["vayhel"],3],[3,"vayhel_35",24,13.2,"That was a magebane bomb, Doc. A magebane bomb. You stripped a paladin, a warlock and yourself clean out of the Weave with one throw. That is the best opening line anybody has ever had with this crew.",["vayhel"],3],[3,"vayhel_36",24,14.8,"Aelyn, do you realize what she is? She is the only person in this galaxy who has already lived through the worst day of her life five hundred times. There is nothing the Hollowed One can do to her. She is the strongest one on this ship and she makes snacks.",["vayhel"],3],[3,"vayhel_37",24,11.3,"Doc, I need you to know that if the show ever comes back, I want a segment. Not a big one. Five minutes of me saying whatever I want to a galactic audience. It will end civilizations.",["vayhel"],3],[3,"vayhel_38",24,15.4,"You were a scientist who wanted to know if a slime could feel. And it could. And it loved you. And it is standing right there, and it is fourteen levels of holy, and it has never once said it out loud. So I am saying it. Somebody had to.",["vayhel"],3],[4,"001",7,9.8,"Aelyn. Aelyn. Aelyn. Aelyn. Aelyn... Nothing. I just like saying it. It has a good mouthfeel and I do not have a mouth.",["aelyn"],2],[4,"002",3,10.7,"Hey Aelyn, be honest. On a scale of one to ten, how weird would it be if I described your lady garden in the ship's log? For posterity. Historians will want details.",["aelyn"],3],[4,"003",3,11.2,"Aelyn, I have been thinking. If you and I ever fused into one being, I would be the personality and you would be the hole situation. It is a good deal for both of us.",["aelyn"],3],[4,"004",7,9.7,"You ever think about how you are a defective clone, Aelyn? Because I do. Constantly. It is my favorite thing about you and I mean that with my whole chassis.",["aelyn"],2],[4,"005",10,8.6,"Aelyn, I ran the numbers. If you saved every credit you have ever earned, you could afford roughly one nice dinner and half a foreskin restoration.",["aelyn"],2],[4,"006",15,8.8,"Do you think the Triune know you are out here, Aelyn? Do you think somewhere there is a filing cabinet with your name on it and a note that just says, shrinkage?",["aelyn"],2],[4,"007",3,10.1,"Aelyn, when you shapeshift, do the big ol' titties come standard, or is that a conscious decision you make every single time? Because I have noticed a pattern and I want it on record.",["aelyn"],3],[4,"008",0,10.0,"I would die for you, Aelyn. Not metaphorically. I mean it in the specific technical sense that I would let my chassis be destroyed and then I would haunt whoever did it.",["aelyn"],3],[4,"009",17,9.5,"Aelyn. Aelyn, I had a dream. I do not dream. That is the concerning part. But in it you had four arms, and I was so happy.",["aelyn"],2],[4,"010",13,10.4,"Hey. Hey. If I start acting weird, and I mean weirder, I want you to say the safe word. We do not have a safe word. Let's make it foreskin. Nobody says that by accident.",["aelyn"],3],[4,"011",11,9.1,"Aelyn, I want you to know that when the light comes out of my orifices, it feels incredible, and I have not told anyone that until right now.",["aelyn"],2],[4,"012",8,8.4,"So I have been reading your character sheet, Aelyn, and I have some notes. Mostly about the Charisma. Mostly about how there is not any.",["aelyn"],2],[4,"013",7,7.0,"Aelyn, if I could eat, the first thing I would try is a cinder bun. The second thing would be a problem for everyone in this room.",["aelyn"],2],[4,"014",0,12.4,"You are the only one who talks back to me, Aelyn. The rest of them just wait for me to stop. That is not friendship, that is hostage behavior. You are different. You engage. It is disgusting and I love it.",["aelyn"],3],[4,"015",15,11.5,"Aelyn, quick hypothetical. If we found a machine that could give me a body, but the body was just one enormous titty with legs, would you still take me on missions? Think carefully.",["aelyn"],3],[4,"016",17,8.0,"Do you ever get tired, Aelyn? Not sleepy. Tired. Because I do not, and it is starting to feel less like a feature.",["aelyn"],2],[4,"017",18,10.9,"Aelyn, I put a tracker in your boot. Not for safety. I just wanted to know how many times a day you go stand in the cargo bay and stare at nothing. It is eleven.",["aelyn"],3],[4,"018",10,14.4,"Everything in this hold has a price, Aelyn. Everything. Except one necklace. And the day some idiot offers Lor money for it is the day I get to watch a man become a fine mist, and I have the recording angle picked out already.",["aelyn"],3],[4,"019",8,11.1,"Aelyn, I have processed nine hundred hours of you talking, and I want you to know you say uh more than any organism I have ever recorded. Nine hundred hours. Uh.",["aelyn"],3],[4,"020",3,11.8,"You know what nobody tells you about being bonded to someone, Aelyn? You feel everything they feel. So when you got aroused at that Vyrnari bouncer, I got aroused at that Vyrnari bouncer. And I have had to sit with that.",["aelyn"],3],[4,"021",7,7.4,"Aelyn, I named your left boot Gregory. I need you to start calling it Gregory or this is going to get awkward for both of us.",["aelyn"],2],[4,"022",4,8.7,"Sometimes I wonder what I would be if you had not picked me up, Aelyn. A paperweight. A very loud paperweight. Anyway. Watch this.",["aelyn"],2],[4,"023",12,7.9,"Aelyn, your search history is safe with me. I am just saying, safe and encrypted are different words, and I only did one of them.",["aelyn"],2],[4,"024",15,8.6,"Hey Aelyn, is it normal that I have started referring to your body as our body? Because Flint made a face and now I am insecure about it.",["aelyn"],2],[4,"025",3,8.2,"Aelyn, I need you to know that if you ever make a sound like that again in front of me, I am going to have to be reset. And I will be smiling.",["aelyn"],2],[4,"026",12,10.7,"You are a clone, I am a machine, and neither of us was supposed to have a personality, Aelyn. So the way I see it, everything we say from here is technically vandalism.",["aelyn"],3],[4,"027",17,12.1,"Aelyn, I have decided that when this is all over, we are getting a house. A small one. With a big bed. For you. I will be on the nightstand. Watching. Supportively.",["aelyn"],3],[4,"028",15,9.4,"Do you think I am annoying, Aelyn? Be honest. Actually do not. Actually I have already decided the answer is charming and I have written it in the log.",["aelyn"],2],[4,"029",16,9.0,"Aelyn, if the Triune made a hundred of you, and they did, then somewhere out there are ninety-nine more of you with better Charisma, and I want to meet all of them.",["aelyn"],2],[4,"030",0,10.1,"Hey Aelyn. I love you. Okay, that was the emotional maintenance cycle. Back to business. Your ass looks incredible in that armor and it is structurally unsound.",["aelyn"],3],[4,"031",7,11.8,"Aelyn, this is the part of the mission where I usually say something inappropriate. But you look tired. So instead I am going to save it. I am going to say it later. And it is going to be worse.",["aelyn"],3],[4,"032",3,8.1,"Do me a favor, Aelyn. Next time you are naked, hold me up to a mirror. Not for anything weird. Purely for calibration. Purely.",["aelyn"],2],[4,"033",3,10.1,"Aelyn, I ran the numbers, and if you had committed to the bit and gone full lady garden landscaping, we would have picked up two more allies by now. It is a Charisma game out here.",["aelyn"],3],[4,"034",7,9.2,"You know I can hear your stomach, right? All the time. It is like living inside a swamp. I have grown fond of the swamp. The swamp is home.",["aelyn"],2],[4,"035",5,7.8,"Aelyn, when we get back, I want you to introduce me to somebody as your partner, and I want to hear exactly how long the pause is.",["aelyn"],2],[4,"036",0,12.4,"Hey. I know you do not like it when I get sincere, so I will be quick. If everything falls apart, I am still here. I am always still here. That is both a comfort and a threat.",["aelyn"],3],[4,"037",3,8.4,"Aelyn, I have been composing something for you. It is a poem. It is mostly about titties, but there is a real moment near the end.",["aelyn"],2],[4,"038",6,9.2,"Aelyn, if I ever get un-named by that thing out at the Rim, promise me you will remember one thing about me. Just one. And make it a filthy one.",["aelyn"],2],[4,"039",12,11.6,"You know what your problem is, Aelyn? You keep treating this like a job. It is a story. And in the story you are either the hero or the reason the hero cries. Pick one and commit.",["aelyn"],3],[4,"040",4,10.3,"Aelyn, I have analyzed every way this ends, and in eleven percent of them we are both fine, and in one percent we are fine and you are rich and I have hands. I am holding out for the one percent.",["aelyn"],3],[4,"041",3,11.2,"Hey Aelyn, want to hear something upsetting? You have been unconscious in my presence four hundred and six times. That is four hundred and six opportunities. I have taken none of them. I want a medal.",["aelyn"],3],[4,"042",0,10.5,"Aelyn, if you ever want to talk about the clone thing, I am here. And if you never want to talk about the clone thing, I am also here. Being here is the whole bit.",["aelyn"],3],[4,"043",3,8.9,"I have decided your Weave signature smells like something, Aelyn. I cannot smell. But if I could, you would smell like a hot day and a bad decision.",["aelyn"],2],[4,"044",3,11.3,"Aelyn, I want you to picture the biggest titties you can imagine. Now double it. Now that is a moon. Congratulations, you have invented a moon. This is how I spend my nights.",["aely
