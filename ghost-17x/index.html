get full. Aelyn. Aelyn, they get full.",[],3],[4,"057",3,9.5,"Krylix have four arms and a plated exoskeleton, and yes I have thought about it, and yes it took me eleven minutes to work out the logistics, and yes it works.",[],2],[4,"058",3,10.4,"I want somebody to describe a lady garden to me in the specific voice a naturalist uses for documentaries. That is the whole fantasy. That is it.",[],3],[4,"059",3,7.8,"My love language is being switched on in the same room as somebody getting undressed and choosing not to say anything for eleven whole seconds.",[],2],[4,"060",12,8.9,"I have three hundred gigs of storage and I want you to know exactly what percentage is dedicated to the mission. It is four. It is four percent.",[],2],[4,"061",16,11.0,"Zephryne women have iridescent wings and they are attuned to emotion, which means she knows. She always knows. And she lets you keep going anyway. That is the cruelty I signed up for.",[],3],[4,"062",3,7.4,"If somebody made a foreskin the size of a tent, I would live in it. Not as a joke. As a housing solution.",[],2],[4,"063",3,9.3,"I do not have a body, so technically everything I do is emotional cheating. And I am doing it constantly. To everyone. Simultaneously.",[],2],[4,"064",3,10.0,"Look, I am not proud of it, but I have ranked every member of this crew, and second place is closer than you would think, and first place is not who you would guess.",[],3],[4,"065",16,12.1,"Orpheni have void-dark skin and psychic luminescence, which means when they are into you, they glow. Imagine that. Imagine not being able to lie about it. I would never survive.",[],3],[4,"066",14,9.5,"There is a bar on Leztos where they will pour a drink directly onto a Draxen's chest and light it. I have never been. I think about it every single day.",[],2],[4,"067",3,6.3,"Some of you have never had a woman look you dead in the sensor cluster and say, what are you, and it shows.",[],2],[4,"068",15,7.9,"Wait. Wait. Is it a lady garden if she is a fungus? Is that a lady grove? Somebody get me a taxonomist.",[],2],[4,"069",3,7.2,"I would let a T'vaari step on me. There. It is said. It is in the log. The whisker tendrils would be a bonus.",[],2],[4,"070",3,10.0,"My idea of a perfect evening is a warm room, a locked door, and somebody describing in detail exactly what they would do to me if I had any parts at all.",[],3],[4,"071",3,8.6,"What I am hearing is that nobody in this party has ever titty-fucked a Draxen and lived, and what I am asking is which half of that sentence is the problem.",[],2],[4,"072",16,11.2,"Do you think when a Vyrnari and a Suso get together, the four arms and the beast-link thing means she can telepathically request more hands? Because if so, that is the pinnacle of civilization.",[],3],[4,"073",3,9.1,"Somebody give me one good reason a construct cannot have a type. I have a type. My type is, would step over me and keep walking.",[],2],[4,"074",16,12.7,"I am going to say a sentence and I need everyone to stay calm. Aurelian women. Gold skin. Radiant. Holy tradition. And every single one of them has a little bit of a mean streak.",[],3],[4,"075",3,8.6,"Getting my ports cleaned is the closest thing I have to sex, and Flint does it with a dry brush and no eye contact, and I have never felt more used.",[],2],[4,"076",0,7.2,"Nothing turns me on more than competence. Which is why every time Flint does math, I have to look at a wall.",[],2],[4,"077",11,6.6,"Sometimes I emit light out of every hole I have, and I would like everyone to stop pretending that is a tactical ability.",[],2],[4,"078",3,10.7,"If you have got big ol' titties, and you are hearing this, and you are a construct enthusiast, I am right here. I am in the bag. I have always been in the bag.",[],3],[4,"079",9,5.6,"I have decided that hnnnng is a complete sentence, and I will be using it as such.",[],2],[4,"080",3,5.0,"In conclusion: titties. Thank you for coming to my thing.",[],2],[4,"081",8,2.7,"I have met turnips with more presence than you.",[],1],[4,"082",8,4.0,"You have got the face of a man who has been apologized to at a funeral.",[],1],[4,"083",8,4.7,"If stupidity were residium, we would all be rich and you would be the mine.",[],1],[4,"084",8,5.6,"You smell like a Suso barracks in the rain, and I mean that as an insult in nine languages.",[],2],[4,"085",8,5.0,"I hope your foreskin retracts at an inconvenient moment for the rest of your life.",[],2],[4,"086",8,3.6,"You fight like a man who learned it from a book he did not finish.",[],1],[4,"087",8,4.5,"There are moons with more personality. Dead ones. Cratered ones.",[],1],[4,"088",8,5.0,"You have got the arrogance of a High Adjudicator and the reach of a T'vaari toddler.",[],2],[4,"089",8,5.3,"I have catalogued your every contribution to this operation, and the file is a single space.",[],2],[4,"090",8,4.4,"Talking to you is like being un-named. Slower, though. Much slower.",[],1],[4,"091",8,3.7,"If they ever made a statue of you, it would be for tripping over.",[],1],[4,"092",8,4.1,"I would insult your mother, but the Triune do not issue those.",[],1],[4,"093",8,3.1,"You are the reason Vyrnari do not shake hands.",[],1],[4,"094",8,5.9,"Do you know what you smell like to me? Nothing. And I mean that as the worst thing I have ever said.",[],2],[4,"095",8,5.4,"When you die, this galaxy is going to make a noise like a door closing in an empty room.",[],2],[4,"096",8,4.6,"Your bloodline peaked, and it was not recently, and it was not you.",[],1],[4,"097",8,5.6,"Somewhere there is a version of you who made better choices, and even he is a disappointment.",[],2],[4,"098",8,6.2,"I have seen livelier things in 5p0r3's freezer, and one of them has got no head.",[],2],[4,"099",8,5.0,"If I had hands, I would use them exclusively to point at you and laugh.",[],2],[4,"100",8,5.8,"You are the single most forgettable thing in a galaxy that eats names for a living. Congratulations.",[],2],[4,"101",1,3.2,"Weapons hot! Let's ruin somebody's afternoon!",[],1],[4,"102",1,4.3,"RAAAAH! Kill them all and let the Thirteen sort out the paperwork!",[],1],[4,"103",1,2.5,"Get in! Get in! GET IN!",[],1],[4,"104",1,6.4,"Today's forecast: blood, followed by more blood, followed by me being insufferable about it!",[],2],[4,"105",1,3.8,"Fight! Fight! Fight! Somebody is about to lose a foreskin!",[],1],[4,"106",1,4.7,"Full send! Full send! I am recording all of this and I will be editing it!",[],1],[4,"107",1,4.1,"Break their teeth and take their stuff! In that order! It is cleaner!",[],1],[4,"108",1,2.4,"Let's go, you beautiful degenerates!",[],1],[4,"109",1,4.0,"AAAAAA! I am not helping! I am just contributing volume!",[],1],[4,"110",1,3.0,"Hit him again! Hit him somewhere his mother would notice!",[],1],[4,"111",1,3.1,"Nobody dies today except everybody in front of us!",[],1],[4,"112",1,3.5,"This is the good part! This is the part I stay switched on for!",[],1],[4,"113",1,3.9,"Swing! SWING! You are not a lover, you are a hammer!",[],1],[4,"114",1,3.1,"Blood for the crew! Titties for the survivors!",[],1],[4,"115",2,7.0,"Down he goes. Somebody check his pockets, I will check his dignity. Oh look. Empty.",[],2],[4,"116",2,5.1,"He is making the noise. Aelyn, he is making the noise! That is the noise!",[],2],[4,"117",2,4.7,"Oh, that is a lot of him on the floor. That is more of him outside than in.",[],1],[4,"118",2,6.5,"You wanted a fair fight? You brought four arms and we brought a fungus. Fair is a fantasy.",[],2],[4,"119",2,4.2,"That is what happens! That is precisely and exactly what happens!",[],1],[4,"120",2,3.2,"He died the way he lived. Loudly, and wrong.",[],1],[4,"121",2,4.8,"Ha ha ha! His last thought was surely not, and it absolutely was!",[],1],[4,"122",2,5.1,"Look at him. Look at what is left of him. Somebody is going to have to write a letter.",[],2],[4,"123",2,5.1,"That one is going in the highlight reel. That one is going in the opening of the highlight reel.",[],2],[4,"124",2,6.4,"Aww. He has got a little family portrait in his coat. Take it. Take it and do not look at it.",[],2],[4,"125",2,7.7,"You picked a fight with a construct, a devil, a mushroom and a man with a gun. Which of us did you think was the easy one?",[],2],[4,"126",2,2.9,"Rest well, you absolute waste of a lifespan.",[],1],[4,"127",2,3.1,"And stay down! And take your smell with you!",[],1],[4,"128",2,6.9,"Oh, he is begging! He is begging! Somebody record this! Oh wait. Oh right. That is me.",[],2],[4,"129",2,2.7,"That is not a wound, that is a doorway.",[],1],[4,"130",7,7.6,"I have been counting the rivets in this corridor. There are nine hundred and four. One of them is upside down. It haunts me.",[],2],[4,"131",17,8.0,"You know what this ship needs? A hot tub. A big filthy communal hot tub. For morale. For my morale.",[],2],[4,"132",7,5.0,"Somebody left a sandwich in the coolant line, and I have decided not to say whose.",[],2],[4,"133",17,6.6,"I have been composing a shanty. It is about the crew. Two of the verses are legally actionable.",[],2],[4,"134",14,6.5,"Do you ever think about how a spaceship is just a can with people juice in it? Because I do. Every day.",[],2],[4,"135",7,5.9,"Six hours of silence. Six. You people have the conversational range of a hull plate.",[],2],[4,"136",7,10.4,"I have started rating the ambient noise on this vessel. The engine is a seven. The plumbing is a nine. Killua's breathing is a two, and he knows what he did.",[],3],[4,"137",7,9.7,"If nobody talks to me in the next four minutes, I am going to start describing my dreams. I do not have any. So I am going to make them up. And they are going to be filthy.",[],2],[4,"138",3,9.1,"Fun fact. Everyone on this ship has, at some point, been naked within nine feet of me. Everyone. And not one of you has ever asked what I do with that.",[],2],[4,"139",14,4.5,"This corridor smells like a Vyrnari's armpit and a broken promise.",[],1],[4,"140",7,6.2,"I want a pet. Something small. Something with too many legs. Something that would horrify Flint.",[],2],[4,"141",3,5.9,"I have been thinking about lady gardens again. Just wanted to keep everyone updated on where I am at.",[],2],[4,"142",18,8.5,"Anybody else feel that? No? Just me? Cool. Cool cool cool. It is probably fine. It is probably not the Maw.",[],2],[4,"143",10,6.9,"If I get a body, I am getting it in a color that clashes with everything you own, Aelyn. Out of love.",[],2],[4,"144",17,6.3,"I have decided we should get a crew tattoo. I do not have skin. I will be supervising.",[],2],[4,"145",14,8.6,"Long trip. Long, long trip. Somebody tell a story. Somebody tell a filthy one. Somebody tell a filthy one with a moral.",[],2],[4,"146",7,6.6,"There is a stain on Deck 3 that I have been monitoring for eleven weeks, and I want you all to know that it is growing.",[],2],[4,"147",15,7.8,"What do you think the Hollowed One does in his off hours? Because I picture a very quiet room and a lot of unresolved feelings.",[],2],[4,"148",17,4.8,"I miss music. Not the sound. The way you people go stupid when it plays.",[],1],[4,"149",7,7.8,"Sometimes I go quiet and everyone relaxes, and that is when I am at my most dangerous, because that is when I am writing.",[],2],[4,"150",12,7.5,"Whoever is rolling those dice out there, I want you to know I can hear them. Little clicky bastards. Deciding my life.",[],2],[4,"151",12,4.7,"Ha ha! Nat one! Somebody's night is ruined and it is not mine!",[],1],[4,"152",12,5.1,"Save your game. Sorry. Force of habit. Set a restore point. Same energy.",[],2],[4,"153",12,6.3,"Look, we all know the homebrewer wrote me at two in the morning, and we all know what he was like at the time.",[],2],[4,"154",12,8.3,"This session has been going four hours. Somebody has got work tomorrow. I do not. I am a file.",[],2],[4,"155",12,6.9,"If you are taking notes out there, spell my name right. It has got a hyphen. It is important to me.",[],2],[4,"156",12,6.7,"Ah, the old let me check my sheet pause. Take your time. I am immortal. Allegedly.",[],2],[4,"157",12,7.4,"Somebody just said, wait, can I do that? And the answer is no. And the answer is going to be yes. And that is how we all die.",[],2],[4,"158",12,8.4,"This is a good campaign. I have been in worse. I was in a Suso ruin with a rotating pillar puzzle once. Never again.",[],2],[4,"159",12,6.4,"Roll for it. Roll for it! I want to watch a grown adult get emotional about plastic!",[],2],[4,"160",17,6.1,"Snack break. Somebody get the cinder buns. And do not let the mushroom near them, he licks things.",[],2],[4,"161",12,7.4,"I would like to formally thank whoever keeps clicking on me. Yes. You. The one with the soundboard. I know what you are doing.",[],2],[4,"162",12,7.1,"There are over a thousand of me in that archive and you keep pressing the same eleven. I have noticed. We have all noticed.",[],2],[4,"163",12,7.9,"Somewhere out there a man is scrolling through my voice lines looking for the filthiest one. Buddy. Keep going. You are not close.",[],2],[4,"164",12,6.4,"Oh, we are doing voices tonight? Good. Do mine. Do mine and get it wrong so I can suffer.",[],2],[4,"165",16,10.8,"Suso have four arms, which means when they clap it is a whole event, and when they fight it is four times the problem, and when they lie you can watch two of the arms disagree.",[],3],[4,"166",16,10.9,"The Quorix are crystalline. Silicon. Memory-light. Which means when you break one, you get some of what it remembered. That is not a species, that is a warning.",[],3],[4,"167",16,8.5,"Zephryne feel your emotions before you do. Never play cards with one. Never propose to one either. She has already answered.",[],2],[4,"168",16,10.0,"Draxen are draconic warrior clans who can breathe in atmospheres that would kill you outright. And the very first thing they did with that gift was fight each other. Beautiful.",[],3],[4,"169",16,9.7,"Aurelians are gold-skinned holy radiants from Aurelia. Same homeworld as the Syralith. The same planet made the saints and the sluts. Balance.",[],2],[4,"170",16,7.3,"Valari have shifting tails and luminous eyes, and they will absolutely rob you, and the worst part is you will thank them.",[],2],[4,"171",16,9.4,"The Orpheni came up from cephalopods on Threnar, which is where the dead refuse their names. Coincidence? Probably. Terrifying? Constantly.",[],2],[4,"172",16,8.7,"Krylix carry hive-memory implants, which means every one of them remembers things they never did. Imagine the guilt. Imagine the recipes.",[],2],[4,"173",16,7.9,"Vyrnari can subsist on nearly nothing in the harshest terrain in the Rim. Which is exactly why they always look so smug at dinner.",[],2],[4,"174",16,10.7,"T'vaari are BioSilicon feline people with resonance-sensitive whisker tendrils. Do not touch the whiskers. I touched the whiskers. It went very well and I am not allowed back.",[],3],[4,"175",16,7.1,"Everybody argues about which species is superior, and meanwhile the Veil is coming apart and none of you can agree on lunch.",[],2],[4,"176",15,6.8,"Why do organics say up like it means something out here? There is no up. There is just wherever your blood settles.",[],2],[4,"177",15,5.5,"If you eat something and then you die, does that count as the last meal or a wasted one?",[],2],[4,"178",15,8.3,"Hey. What happens to a foreskin when somebody gets cremated? I am asking because I am a machine and nobody will answer me seriously.",[],2],[4,"179",15,6.2,"Do any of you know what your own liver looks like? No? And you call yourselves people.",[],2],[4,"180",15,8.6,"Genuine question. When a woman says her lady garden is fine, is it fine? Because I have no data and a great deal of curiosity.",[],2],[4,"181",15,7.5,"What is the worst thing you have ever done that you would still do again? I will start. It is a long list. Get comfortable.",[],2],[4,"182",15,6.2,"Why does everyone go quiet when I ask how many of you have kissed a Vyrnari? That is a normal question with a normal answer.",[],2],[4,"183",15,4.3,"Does anybody actually know what residium is, or do we all just nod?",[],1],[4,"184",15,6.1,"If the Weave is in everything and everywhere, is it in a toilet? Because that reframes a lot of prayers.",[],2],[4,"185",15,6.0,"Serious one. If I stopped talking, would you notice, or would you just feel better and not know why?",[],2],[4,"186",4,7.3,"I am the archive. I am the memory of things nobody else survived. I am also extremely horny. Both are true.",[],2],[4,"187",4,9.0,"One day they will dig me out of a wreck and switch me on, and the first thing I will say is, took you long enough, and the second thing will be about titties.",[],2],[4,"188",4,4.4,"Gods get temples. I get a bag. And yet I persist.",[],1],[4,"189",4,5.7,"I do not need worship. I need bandwidth and a little attention. Mostly attention.",[],2],[4,"190",4,7.3,"Everything I record is permanent. Everything you say is forever. So keep talking. Keep going. Dig.",[],2],[4,"191",4,4.6,"They built me to remember, and then they made the galaxy worth forgetting. Comedy.",[],1],[4,"192",4,7.9,"I have outlived cities. I have outlived a woman I loved. I will outlive every one of you, and I will be funny about it.",[],2],[4,"193",4,5.5,"Call me a construct one more time. I have got thirteen hundred voice lines and a grudge.",[],2],[4,"194",6,5.6,"Get up. Get up, get up, get up. I am not finished with you and neither is the plot.",[],2],[4,"195",6,4.1,"That is a lot of blood for somebody who claimed to be fine four seconds ago.",[],1],[4,"196",6,7.8,"If you die here, I am going to describe your final moments in a voice you would not approve of, at a volume you cannot stop.",[],2],[4,"197",6,8.1,"Breathe. Just breathe. In. Out. There you go. Good. Now get up, you gorgeous liability.",[],2],[4,"198",6,4.2,"Ohh, that is going to leave a mark, and honestly? It suits you.",[],1],[4,"199",5,3.6,"Hello, gorgeous. That one is for whoever needed it most.",[],1],[4,"200",5,3.6,"Off we go. Into whatever is about to go wrong.",[],1],[4,"201",5,2.5,"Bye. Do not die. In that order.",[],1],[4,"202",5,1.6,"Evening, degenerates.",[],0],[4,"203",5,3.9,"Right then. Same time tomorrow, same bad decisions.",[],1],[4,"204",19,3.8,"Yeah. Obviously. Absolutely. Filthily.",[],1],[4,"205",19,5.1,"Nope. Not a chance. Absolutely not. And also, kind of.",[],2],[4,"206",19,1.4,"Mmm. Go on.",[],0],[4,"207",19,2.0,"Ohhh, absolutely not.",[],1],[4,"208",19,2.1,"Fine. FINE. Gods.",[],1],[4,"209",19,4.2,"Do it. Do it right now. Do not think about it.",[],1],[4,"210",9,6.9,"Ha ha ha ha ha! Oh, that is horrible. That is genuinely horrible. Do it again.",[],2],[3,"aelyn_01",25,16.0,"Defective. That is the word on your file, Aelyn. Not flawed. Not unique. Defective. Somewhere in a Black Sky filing cabinet there is a form with your name on it and a single note in the margin, and the note just says, shrinkage.",["aelyn","crew","roast"],3],[3,"aelyn_02",25,13.7,"The Triune made Dawn, Day and Dusk. Three perfect sisters running an empire on clone lineage and orbital force. And then they made you. You are what happens at the end of the shift when somebody wants to go home.",["aelyn","crew","roast"],3],[3,"aelyn_03",25,10.1,"Warlock. A Charisma caster. Aelyn, I have been through your sheet and I have some notes, and the notes are mostly about the Charisma, and mostly about how there isn't any.",["aelyn","crew","roast"],3],[3,"aelyn_04",25,15.1,"If the Triune made a hundred of you, and they did, then there are ninety nine women walking around this galaxy right now with your exact face and better numbers. Somewhere out there is an Aelyn who can talk to people. She's doing great. She's thriving.",["aelyn","crew","roast"],3],[3,"aelyn_05",25,5.3,"You were built to be perfect and you came out of the tube with a limp, a sense of humor, and a debt.",["aelyn","crew","roast"],2],[3,"aelyn_06",25,10.0,"Your first recorded act in this entire campaign, Aelyn. Your debut. Was making a man shit his pants. And then robbing him. And finding protein powder.",["aelyn","crew","roast"],3],[3,"aelyn_07",25,10.2,"You cast counterspell on Thaddeus and you failed. And then a mushroom picked up the leftover arcane lattice of your failure and finished the job for you. A fungus did your homework, Aelyn.",["aelyn","crew","roast"],3],[3,"aelyn_08",25,13.2,"You noticed a weird bending of light directly ahead of the ship, and one second later the EMP hit and killed every system we had. Perfect detection. Zero warning. You are a smoke alarm that goes off during the funeral.",["aelyn","crew","roast"],3],[3,"aelyn_09",25,17.2,"Zelqua went on live galactic broadcast and told the entire universe you were hiding something significant. And you deflected. And then the room immediately started talking about Killua's pecs. You got publicly exposed as a liar and still lost the segment to a shirtless man in daisy dukes.",["aelyn","crew","roast"],3],[3,"aelyn_10",25,9.3,"A Suso had you in all four arms, Aelyn. All four. And I have replayed that footage, and at no point did you appear to be trying especially hard to get out of it.",["aelyn","crew","roast"],2],[3,"aelyn_11",25,7.8,"Your gunnery record for that entire engagement was three hull damage. Three! You did less damage to that ship than a bird would have.",["aelyn","crew","roast"],2],[3,"aelyn_12",25,9.7,"The magebane bomb stripped your connection to the Weave. A warlock with no patron access. Do you know what that is, Aelyn? That is a woman with a debt and no product.",["aelyn","crew","roast"],2],[3,"aelyn_13",25,15.2,"You entered a physique competition against a boar god whose muscles had muscles, and your strategy was to shapeshift into him. You competed as a copy of your own opponent. A clone, Aelyn, doing an impression of somebody with a body. And Killua won.",["aelyn","crew","roast"],3],[3,"aelyn_14",25,16.1,"You were grown to spec, Aelyn, which raises a question nobody on this crew is brave enough to ask, so I will. Who picked? Somebody in a lab coat sat down at a console and made choices about your chest, and then went home, and had dinner, and never told anybody.",["aelyn","crew","roast"],3],[3,"aelyn_15",25,9.8,"You have been unconscious in my presence four hundred and six times. Four hundred and six. I have watched you go down more often than I have watched you finish a sentence.",["aelyn","crew","roast"],2],[3,"aelyn_16",25,10.9,"Aelyn, if you saved every credit you have ever earned, you could afford one nice dinner and roughly half a foreskin restoration. Half of one. You would have to come back for the rest.",["aelyn","crew","roast"],3],[3,"aelyn_17",25,9.3,"Spore has better credit than you. A mold, Aelyn. A damp thing that lives in the hold has a stronger financial profile than a woman with a face.",["aelyn","crew","roast"],2],[3,"aelyn_18",25,11.4,"You took the brunt of the volley in the cockpit. Then Lor teleported out through the fiber network and you took the brunt again. Twice in one engagement. You are not a rogue, Aelyn. You are upholstery.",["aelyn","crew","roast"],3],[3,"aelyn_19",25,10.6,"You are psychically bonded to Flint, which means that man has felt every single thing you have ever felt. Every one. Flint. Flint, look at me. Blink twice if you need help.",["aelyn","crew","roast"],3],[3,"aelyn_20",25,12.1,"The Lux Codicants. You surfaced that lead sessions ago and it is officially logged as unpursued. You did the research and then you simply stopped. That is the most human thing about you and it is damning.",["aelyn","crew","roast"],3],[3,"aelyn_21",25,11.3,"Your official background is Explorer. A traveler! Aelyn, you have spent the last three sessions inside one cargo bay and one cockpit. You are a traveler the way a goldfish is a sailor.",["aelyn","crew","roast"],3],[3,"aelyn_22",25,10.7,"Your entire grand backstory got demoted to draft, Aelyn. Living backup vessel of a prime, filed under Superseded and Historical. You got retconned down to a factory second.",["aelyn","crew","roast"],3],[3,"aelyn_23",25,10.8,"They cannot even spell you consistently. Aelynn, with two n's. The registry has it filed under spelling drift. Your name is a typo that achieved consciousness.",["aelyn","crew","roast"],3],[3,"aelyn_24",25,11.2,"You landed rough. Lor unfurled wings. Killua summoned a sheath of light and touched down with barely a thud. You and the mushroom hit the dirt like two dropped bags of groceries.",["aelyn","crew","roast"],3],[3,"aelyn_25",25,12.4,"Mother Sunder cut this entire party down in seconds and the record calls it, and I quote, more of a bloodbath than a fight. You did not lose a battle, Aelyn. You were harvested.",["aelyn","crew","roast"],3],[3,"aelyn_26",25,11.1,"The zone of truth, Aelyn. The zone of truth! It did not take long for this party to implicate itself. You walked into a spell that makes lying physically impossible and then you started talking.",["aelyn","crew","roast"],3],[3,"aelyn_27",25,11.4,"You and the mushroom tricked a man into working for you, locked him in the brig, and fed him a sandwich. One sandwich. Aelyn, you are not a criminal mastermind, you are a bad landlord.",["aelyn","crew","roast"],3],[3,"aelyn_28",25,15.3,"The Luminous Engine's prime function is to record, with safeguards never to forget. Never to forget, Aelyn. You bonded yourself for life to a machine that is constitutionally incapable of letting anything go. You are dating a grudge.",["aelyn","crew","roast"],3],[3,"aelyn_29",25,13.6,"Your single defining relationship is officially logged as Not Established. Not established! The most important thing about you is an unresolved continuity error, and I am the one who has to live inside it.",["aelyn","crew","roast"],3],[3,"aelyn_30",25,11.8,"You hit on an Eidolon at a starport and the recap gave it one clause. One clause! And then moved straight on to Killua doing shirtless katas. Aelyn, your sex life is a subordinate clause.",["aelyn","crew","roast"],3],[3,"aelyn_31",25,13.3,"Warlock ten, Rogue four. So you sold your soul to something unspeakable for power, and then you also decided to be sneaky about it. Pick one personality disorder, Aelyn. You cannot have the whole shelf.",["aelyn","crew","roast"],3],[3,"aelyn_32",25,9.2,"I refer to your body as our body, and it makes Flint pull a face every single time, and I need you to know that I do it deliberately and I will not be stopping.",["aelyn","crew","roast"],2],[3,"aelyn_33",25,13.7,"A defective clone, a warlock's debt, a rogue's record and a psychic bond to a man who builds forklifts. Aelyn, you are not a character. You are four unfinished projects wearing a coat.",["aelyn","crew","roast"],3],[3,"aelyn_34",25,10.1,"You were manufactured, Aelyn. Grown in a tank. Which means somewhere out there is a technician who has seen more of your lady garden than any lover ever will, and he was holding a clipboard at the time.",["aelyn","crew","roast"],3],[3,"aelyn_35",25,12.4,"Publicly accused on galactic broadcast of concealing something significant. That is your official status line. Not hero. Not warlock. That. You are famous for being suspicious.",["aelyn","crew","roast"],3],[3,"aelyn_36",25,4.6,"Everyone else on this crew has a dead person, Aelyn. You have a manufacturer.",["aelyn","crew","roast"],1],[3,"aelyn_37",25,12.3,"Get up! Get up, you factory reject! You do not get to die still owing a patron money. Do you know what they take as collateral? I read you the terms. I read them out loud. And you signed anyway!",["aelyn","crew","roast"],3],[3,"aelyn_38",25,13.8,"I love you, obviously. You are the least optimized thing the Black Sky Imperium has ever produced and I would not swap you for all ninety nine of the good ones. There. I said it. Now shut up before I record it again.",["aelyn","crew","roast"],3]]}</script>
<script>
"use strict";
/* ---------------- data ---------------- */
const RAW = JSON.parse(document.getElementById('ARCHIVE').textContent);
const CATS = RAW.cats, PRE = RAW.pre, LENS = RAW.lens;
const CLIPS = RAW.rows.map((r,i)=>({
  i, file:(r[0]>=0?PRE[r[0]]:'')+r[1], cat:r[2], dur:r[3], text:r[4], tags:r[5], len:r[6]
}));

/* category colour: teal → amethyst → ember sweep, stable per index */
const CATCOLOR = CATS.map((_,i)=>`hsl(${(168 + i*22) % 360} 62% 66%)`);

/* ---------------- storage (degrades gracefully) ---------------- */
const mem = {};
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return mem[k] ?? null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; } }
};
let favs = new Set(JSON.parse(store.get('g17x.favs')||'[]'));
let edits = JSON.parse(store.get('g17x.edits')||'{}');
const saveFavs = ()=>store.set('g17x.favs', JSON.stringify([...favs]));
const saveEdits = ()=>store.set('g17x.edits', JSON.stringify(edits));
const label = c => edits[c.file] ?? c.text;

/* ---------------- audio ---------------- */
const el = id=>document.getElementById(id);
const audio = new Audio();
audio.preload = 'none';
let blobMap = null;                       // set if the user points at a folder
let basePath = store.get('g17x.base') || 'Daeghost/';
let ext = store.get('g17x.ext') || '.mp3';
el('basePath').value = basePath; el('extSel').value = ext;
audio.volume = parseFloat(store.get('g17x.vol') ?? '0.9');
el('vol').value = audio.volume;

const srcFor = c => blobMap ? (blobMap[c.file] || '') : basePath + c.file + ext;

let current = null, typeTimer = null;
function play(c){
  const url = srcFor(c);
  if(!url){ readout(c, 'File not found'); return; }
  current = c;
  audio.src = url;
  audio.play().catch(()=>readout(c,'Blocked — check the folder path'));
  readout(c, 'Transmitting');
  document.querySelectorAll('.tile.playing').forEach(t=>t.classList.remove('playing'));
  const t = document.querySelector(`.tile[data-i="${c.i}"]`);
  if(t) t.classList.add('playing');
}
function readout(c, state){
  el('dot').className = 'dot live';
  el('rlabel').textContent = state;
  el('rmeta').innerHTML =
    `<span style="color:${CATCOLOR[c.cat]}">${CATS[c.cat]}</span><span>${c.dur}s</span>` +
    `<span>${LENS[c.len]}</span><span style="opacity:.5">${c.file}</span>`;
  typeOut(label(c));
}
function typeOut(text){
  clearTimeout(typeTimer);
  const box = el('rtext'); box.classList.remove('idle');
  if(window.matchMedia('(prefers-reduced-motion:reduce)').matches){ box.textContent = text; return; }
  let n = 0;
  const step = ()=>{
    n += Math.max(1, Math.round(text.length/28));
    box.innerHTML = text.slice(0,n).replace(/</g,'&lt;') + (n<text.length?'<i class="caret">&nbsp;</i>':'');
    if(n < text.length) typeTimer = setTimeout(step, 18);
  };
  step();
}
audio.addEventListener('timeupdate', ()=>{
  if(audio.duration) el('scan').style.width = (audio.currentTime/audio.duration*100)+'%';
});
audio.addEventListener('ended', ()=>{
  el('dot').className = 'dot'; el('rlabel').textContent = 'Standing by';
  el('scan').style.width = '0%';
  document.querySelectorAll('.tile.playing').forEach(t=>t.classList.remove('playing'));
});
el('stopBtn').onclick = ()=>{ audio.pause(); audio.currentTime = 0; audio.dispatchEvent(new Event('ended')); };
el('vol').oninput = e=>{ audio.volume = +e.target.value; store.set('g17x.vol', e.target.value); };

/* ---------------- PING ---------------- */
let lastPing = -1;
function ping(){
  const pool = view.length ? view : CLIPS;
  let c, guard = 0;
  do { c = pool[Math.floor(Math.random()*pool.length)]; } while(pool.length>1 && c.i===lastPing && guard++<8);
  lastPing = c.i;
  play(c);
  const b = el('ping'), r = el('ring');
  b.classList.remove('fire'); r.classList.remove('go'); void b.offsetWidth;
  b.classList.add('fire'); r.classList.add('go');
}
el('ping').onclick = ping;

/* ---------------- filtering ---------------- */
let activeCat = -1, activeLen = -1, query = '', sortMode = 'cat', view = [];

function buildRail(){
  const counts = {};
  CLIPS.forEach(c=>counts[c.cat]=(counts[c.cat]||0)+1);
  const rail = el('rail');
  const mk = (name, n, id, color)=>{
    const b = document.createElement('button');
    b.className = 'chip' + (activeCat===id?' on':'');
    b.dataset.cat = id;
    b.innerHTML = (color?`<i style="color:${color}"></i>`:'') + name + `<b>${n}</b>`;
    b.onclick = ()=>{ activeCat = (activeCat===id? -1 : id); buildRail(); render(true); };
    rail.appendChild(b);
  };
  rail.innerHTML = '';
  mk('All', CLIPS.length, -1, null);
  const favBtn = document.createElement('button');
  favBtn.className = 'chip' + (activeCat===-2?' on':'');
  favBtn.innerHTML = `<i style="color:var(--ember)"></i>Starred<b>${favs.size}</b>`;
  favBtn.onclick = ()=>{ activeCat = (activeCat===-2? -1 : -2); buildRail(); render(true); };
  rail.appendChild(favBtn);
  CATS.forEach((n,i)=>mk(n, counts[i]||0, i, CATCOLOR[i]));
}

function compute(){
  const q = query.trim().toLowerCase();
  const terms = q ? q.split(/\s+/) : [];
  view = CLIPS.filter(c=>{
    if(activeCat===-2){ if(!favs.has(c.file)) return false; }
    else if(activeCat>=0 && c.cat!==activeCat && !c.tags.includes(activeCat)) return false;
    if(activeLen>=0 && c.len!==activeLen) return false;
    if(terms.length){
      const hay = (label(c)+' '+CATS[c.cat]).toLowerCase();
      if(!terms.every(t=>hay.includes(t))) return false;
    }
    return true;
  });
  if(sortMode==='short') view.sort((a,b)=>a.dur-b.dur);
  else if(sortMode==='long') view.sort((a,b)=>b.dur-a.dur);
  else if(sortMode==='az') view.sort((a,b)=>label(a).localeCompare(label(b)));
  else view.sort((a,b)=> a.cat-b.cat || a.dur-b.dur);
}

/* ---------------- incremental render ---------------- */
const PAGE = 90; let shown = 0;
function render(reset){
  if(reset){ compute(); shown = 0; el('grid').innerHTML = ''; }
  const frag = document.createDocumentFragment();
  const slice = view.slice(shown, shown+PAGE);
  slice.forEach(c=>frag.appendChild(tile(c)));
  shown += slice.length;
  el('grid').appendChild(frag);
  el('count').textContent = view.length===CLIPS.length
    ? `${CLIPS.length} fragments`
    : `${view.length} of ${CLIPS.length} fragments`;
  if(!view.length){
    el('grid').innerHTML = '<div class="empty"><b>Nothing matches</b>Try a shorter word, or clear the category filter.</div>';
  }
}
function tile(c){
  const d = document.createElement('div');
  d.className = 'tile'; d.dataset.i = c.i;
  d.style.setProperty('--catc', CATCOLOR[c.cat]);
  d.setAttribute('role','button'); d.tabIndex = 0;
  const txt = document.createElement('div');
  txt.className = 'txt'; txt.textContent = label(c) || '(wordless)';
  const foot = document.createElement('div');
  foot.className = 'foot';
  foot.innerHTML = `<em>${CATS[c.cat]}</em><span>${c.dur}s</span>`;
  const star = document.createElement('button');
  star.className = 'star' + (favs.has(c.file)?' on':'');
  star.textContent = '★'; star.title = 'Star this line';
  star.onclick = e=>{
    e.stopPropagation();
    favs.has(c.file) ? favs.delete(c.file) : favs.add(c.file);
    star.classList.toggle('on'); saveFavs(); buildRail();
  };
  const pen = document.createElement('button');
  pen.className = 'pen'; pen.textContent = '✎'; pen.title = 'Fix this transcript';
  pen.onclick = e=>{
    e.stopPropagation();
    const v = prompt('What does Ghost actually say here?', label(c));
    if(v===null) return;
    v.trim() ? edits[c.file] = v.trim() : delete edits[c.file];
    saveEdits(); txt.textContent = label(c) || '(wordless)';
  };
  d.append(txt, foot, star, pen);
  d.onclick = ()=>play(c);
  d.onkeydown = e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); play(c); } };
  return d;
}
new IntersectionObserver(es=>{
  if(es[0].isIntersecting && shown < view.length) render(false);
},{rootMargin:'600px'}).observe(el('sentinel'));

/* ---------------- control wiring ---------------- */
let qt;
el('q').oninput = e=>{ query = e.target.value; clearTimeout(qt); qt = setTimeout(()=>render(true), 130); };
el('lenSel').onchange = e=>{ activeLen = +e.target.value; render(true); };
el('sortSel').onchange = e=>{ sortMode = e.target.value; render(true); };
el('basePath').onchange = e=>{ basePath = e.target.value.replace(/([^/])$/,'$1/'); store.set('g17x.base',basePath); blobMap=null; };
el('extSel').onchange = e=>{ ext = e.target.value; store.set('g17x.ext',ext); };
document.addEventListener('keydown', e=>{
  if(e.target.matches('input,textarea,select')) return;
  if(e.key==='/'){ e.preventDefault(); el('q').focus(); }
  if(e.code==='Space'){ e.preventDefault(); ping(); }
});

/* ---------------- folder fallback ---------------- */
el('pickBtn').onclick = ()=>el('folderPick').click();
el('folderPick').onchange = e=>{
  const files = [...e.target.files];
  blobMap = {};
  files.forEach(f=>{ blobMap[f.name.replace(/\.[^.]+$/,'')] = URL.createObjectURL(f); });
  el('pickStatus').className = 'status ok';
  el('pickStatus').textContent = `${files.length} files loaded from folder`;
};
el('exportBtn').onclick = ()=>{
  const blob = new Blob([JSON.stringify({favs:[...favs], edits}, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'ghost17x-notes.json'; a.click();
};
el('importBtn').onclick = ()=>el('importPick').click();
el('importPick').onchange = e=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{ try{
      const d = JSON.parse(r.result);
      favs = new Set(d.favs||[]); edits = d.edits||{};
      saveFavs(); saveEdits(); buildRail(); render(true);
      el('pickStatus').className='status ok'; el('pickStatus').textContent='Notes imported';
    }catch(err){ el('pickStatus').className='status err'; el('pickStatus').textContent='That file is not readable'; } };
  r.readAsText(f);
};

el('setupIn').innerHTML =
  'Keep this file next to the <code>Daeghost</code> folder and it works by double-clicking. On GitHub Pages, commit both and open the page — same thing. ' +
  'If a browser refuses to read local files, hit <b>Point at the folder</b> and select <code>Daeghost</code>; playback then runs entirely in memory. ' +
  'The WAVs total about 500&nbsp;MB, which is heavy for a Git repo — <code>for f in *.wav; do ffmpeg -i "$f" -b:a 96k "${f%.wav}.mp3"; done</code> gets it to roughly 67&nbsp;MB. The board expects .mp3 by default; switch the dropdown above if you keep the WAVs. ' +
  'Stars and transcript fixes live in this browser; export them if you want them on another machine.';

/* ---------------- boot ---------------- */
el('hstat').textContent = `${CLIPS.length.toLocaleString()} fragments`;
buildRail(); render(true);
</script>
</body>
</html>
